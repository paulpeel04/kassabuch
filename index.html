// ---------- charts: "Entwicklung" card ----------
// Four views of the same data: account balance over time (line), spending per day (calendar heatmap),
// spending per month or week (bars) and the running total of the selected month against the budget path.
const CH={};
const RANGES=[['1M','1M'],['3M','3M'],['6M','6M'],['YTD','YTD'],['1J','1J'],['ALL','Alles']];
const CTABS=[['monate','Monate','<path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/>'],['verlauf','Monatsverlauf','<path d="M3 20h18"/><path d="M4 18c5-1 8-5 10-9s4-5 6-5"/><path d="M4 18L20 6" stroke-dasharray="2 3"/>'],['heat','Kalender','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M13 4v16M18 4v16"/>'],['konto','Kontostand','<path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/>']];
// the balance chart only exists when the Abgleich or Vermögen is switched on; spending comes first
const kontoOn=()=>mod('check')||mod('wealth');
const chartState=()=>{const st=S.chart||(S.chart={tab:'monate',range:'1J',metric:'cash'});if(st.tab==='konto'&&!kontoOn())st.tab='monate';if(st.metric==='wealth'&&!mod('wealth'))st.metric='cash';return st};
const firstDate=()=>TX.length?TX[TX.length-1].d:today();
function rangeFrom(r){const t=today();if(r==='YTD')return t.slice(0,4)+'-01-01';if(r==='ALL')return firstDate();const m={'1M':1,'3M':3,'6M':6,'1J':12}[r]||12;return addDays(addMonths(t,-m),1)}
function daysRange(from,to){const out=[];let d=from;let g=0;while(d<=to&&g<4000){out.push(d);d=addDays(d,1);g++}return out}
const monLab=iso=>`${MS[+iso.slice(5,7)-1]} '${iso.slice(2,4)}`;
const short=v=>{const a=Math.abs(v);const s=a>=10000?Math.round(a/1000)+'k':a>=1000?(Math.round(a/100)/10).toString().replace('.',',')+'k':String(Math.round(a));return (v<0?'−':'')+s+' €'};
function niceTicks(lo,hi,n){if(hi-lo<1e-9){hi=lo+1}const span=hi-lo;const raw=span/n;const p=10**Math.floor(Math.log10(raw));const st=[1,2,2.5,5,10].map(x=>x*p).find(x=>span/x<=n)||10*p;const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st;const t=[];for(let v=a;v<=b+st/2;v+=st)t.push(Math.round(v*100)/100);return t}

// ----- daily balance of the reconciled accounts -----
// Rebuilt from the bookings and pinned to every known exact balance (reconciliations, month-end values).
// Between two known balances the remaining difference is spread evenly, so the line matches the bank at each of them.
function cashSeries(from,to){const cash=D.settings.cashAccounts||[];if(!cash.length)return {err:'Wähle unter Einstellungen die Konten im Abgleich.'};
  const E={};const add=(d,e)=>{E[d]=(E[d]||0)+e};
  for(const t of TX){const e=cashEffect(t,cash);if(e)add(t.bd||t.d,e)}
  for(const x of Object.values(D.debts)){if(!x.txId&&x.acc&&cash.includes(x.acc)&&+x.a>0)add(x.d,-x.a);if(x.done&&x.settleAcc&&cash.includes(x.settleAcc)&&x.doneAt)add(x.doneAt,+x.a)}
  const anchors=[];const checkMonths=new Set();
  for(const c of D.checks){if(!cash.every(a=>c.bal&&c.bal[a]!=null))continue;let b=cash.reduce((s,a)=>s+(+c.bal[a]||0),0);
    const inc=checkIncl(c);if(inc)for(const t of TX){if((t.bd||t.d)===c.d&&!inc.has(t.id))b+=cashEffect(t,cash)}
    anchors.push({d:c.d,b});checkMonths.add(c.d.slice(0,7))}
  const curM=today().slice(0,7);
  for(const [k,w] of Object.entries(D.wealth)){if(k>=curM||checkMonths.has(k))continue;const v=w.v||{};if(!cash.every(a=>v[a]!=null))continue;const [y,m]=k.split('-').map(Number);anchors.push({d:`${k}-${pad(dim(y,m))}`,b:cash.reduce((s,a)=>s+(+v[a]||0),0)})}
  if(!anchors.length)return {err:'Für den Kontostand-Verlauf braucht die App einen Abgleich oder einen Monatsstand.'};
  anchors.sort((a,b)=>a.d.localeCompare(b.d));
  const start=[from,firstDate(),anchors[0].d].sort()[0];const end=[to,anchors[anchors.length-1].d].sort().pop();
  const days=daysRange(start,end);const cum={};let run=0;for(const d of days){run+=E[d]||0;cum[d]=run}
  const last=anchors[anchors.length-1];const R=d=>last.b+cum[d]-cum[last.d];
  const errs=anchors.map(a=>({d:a.d,e:a.b-R(a.d)}));
  const corr=d=>{if(d<=errs[0].d)return errs[0].e;if(d>=errs[errs.length-1].d)return errs[errs.length-1].e;
    for(let i=1;i<errs.length;i++){if(d<=errs[i].d){const a=errs[i-1],b=errs[i];const f=daysBetween(d,a.d)/Math.max(1,daysBetween(b.d,a.d));return a.e+(b.e-a.e)*f}}return 0};
  const f0=from<firstDate()?firstDate():from;
  const pts=daysRange(f0,to).map(d=>[d,r2(R(d)+corr(d))]);
  return {pts,anchors:anchors.filter(a=>a.d>=f0&&a.d<=to),label:cash.join(' + ')}}
function wealthSeries(from,to){const keys=Object.keys(D.wealth).sort();const pts=[];
  for(const k of keys){const [y,m]=k.split('-').map(Number);const d=k===today().slice(0,7)?today():`${k}-${pad(dim(y,m))}`;if(d<from.slice(0,7)+'-01'||d>to)continue;const t=wealthTot(k);if(t!=null)pts.push([d,r2(t)])}
  return pts.length?{pts,label:'alle Konten unter „Vermögen“'}:{err:'Noch keine Vermögensstände eingetragen.'}}

// ----- generic SVG line chart over an index axis -----
function lineSvg(id,{n,series,ticks,yfmt=short,label,zero,H=300,W=1000,L=70,cls='big'}){const Rr=W<700?10:18,T=W<700?10:16,B=W<700?24:34;
  let lo=Infinity,hi=-Infinity;for(const s of series)for(const [i,v] of s.pts){if(v==null)continue;lo=Math.min(lo,v);hi=Math.max(hi,v)}
  if(!isFinite(lo)){lo=0;hi=1}if(zero)lo=Math.min(lo,0);const pad0=(hi-lo)*.08||1;const yt=niceTicks(zero&&lo>=0?0:lo-pad0,hi+pad0,5);const y0=yt[0],y1=yt[yt.length-1];
  const X=i=>L+(n<=1?0:i/(n-1))*(W-L-Rr),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g=`<svg class="chart ${cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" data-chart="${id}"><defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  for(const v of yt){const yy=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-10}" y="${yy+4}" text-anchor="end">${yfmt(v)}</text>`}
  for(const t of ticks)g+=`<text x="${X(t.i)}" y="${H-(W<700?6:10)}" text-anchor="middle">${t.l}</text>`;
  series.forEach((s,si)=>{const pts=s.pts.filter(p=>p[1]!=null);if(!pts.length)return;const d=pts.map((p,k)=>`${k?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    if(s.area)g+=`<path d="${d}L${X(pts[pts.length-1][0]).toFixed(1)},${Y(y0)}L${X(pts[0][0]).toFixed(1)},${Y(y0)}Z" fill="url(#g-${id})"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.6}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(s.dots)for(const p of pts)g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="var(--card)" stroke="${s.color}" stroke-width="2"/>`});
  g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>${series.map((s,si)=>`<circle class="hd" data-s="${si}" r="5" fill="${s.color}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`).join('')}
    <rect class="hov" x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="transparent"/></svg>`;
  CH[id]={kind:'line',n,W,L,Rr,X,Y,series};return g}

// ----- tab: Kontostand -----
function cKonto(st){const to=today(),from=rangeFrom(st.range);const r=st.metric==='wealth'?wealthSeries(from,to):cashSeries(from,to);
  const sw=mod('wealth')&&mod('check')?`<div class="seg sm" role="group" aria-label="Was zeigen"><button type="button" data-act="chartMetric" data-m="cash" aria-pressed="${st.metric!=='wealth'}">Konten</button><button type="button" data-act="chartMetric" data-m="wealth" aria-pressed="${st.metric==='wealth'}">Vermögen</button></div>`:'';if(!mod('check'))st.metric='wealth';
  if(r.err)return {head:`<div class="clbl">${st.metric==='wealth'?'Vermögen':'Kontostand'}</div><div class="cbig">–</div>`,tools:sw,body:`<div class="empty">${esc(r.err)}</div>`,kpis:''};
  const pts=r.pts;const n=st.metric==='wealth'?pts.length:daysBetween(pts[pts.length-1][0],pts[0][0])+1;const d0=pts[0][0];
  const idx=st.metric==='wealth'?pts.map((p,i)=>[i,p[1]]):pts.map(p=>[daysBetween(p[0],d0),p[1]]);
  const dateAt=i=>st.metric==='wealth'?pts[Math.max(0,Math.min(pts.length-1,i))][0]:addDays(d0,i);
  const ticks=[];if(st.metric==='wealth')pts.forEach((p,i)=>{if(pts.length<=13||i%2===0)ticks.push({i,l:monLab(p[0])})});
  else{const span=n;let last='';for(let i=0;i<n;i++){const d=addDays(d0,i);if(span>75){if(d.slice(8)==='01'&&d.slice(0,7)!==last){const mm=+d.slice(5,7);if(span<=200||mm%2===1)ticks.push({i,l:monLab(d)});last=d.slice(0,7)}}else if(new Date(d+'T12:00').getDay()===1)ticks.push({i,l:fmtShort(d)})}}
  const first=pts[0][1],lastV=pts[pts.length-1][1],ch=lastV-first;const vals=pts.map(p=>p[1]);const hi=Math.max(...vals),lo=Math.min(...vals);
  const hiD=pts[vals.indexOf(hi)][0],loD=pts[vals.indexOf(lo)][0];
  const svg=lineSvg('konto',{n,series:[{name:st.metric==='wealth'?'Vermögen':'Kontostand',color:'var(--accent)',area:true,pts:idx,dots:st.metric==='wealth'}],ticks,label:'Kontostand im Zeitverlauf'});
  CH.konto.lab=i=>st.metric==='wealth'?`${MONTHS[+dateAt(i).slice(5,7)-1]} ${dateAt(i).slice(0,4)}`:fmtDay(dateAt(i));CH.konto.fmt=v=>eur(v);
  CH.konto.click=i=>{const d=dateAt(i);return st.metric==='wealth'?null:{from:d,to:d}};
  return {head:`<div class="clbl">${st.metric==='wealth'?'Vermögen':'Kontostand'} <span class="muted">· ${esc(r.label)}</span></div><div class="cbig">${eur(lastV)}</div><div class="cchg ${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${sgn(ch)} <span class="muted">seit ${fmtDate(pts[0][0])}</span></div>`,
    tools:sw,body:svg+`<p class="small muted cnote">${st.metric==='wealth'?'Monatsstände aus „Vermögen“.':'Täglich aus deinen Buchungen berechnet und an jedem Abgleich bzw. Monatsstand ausgerichtet. Punkt anklicken = Buchungen an diesem Tag.'}</p>`,
    kpis:`<div class="kpis row4">${kpi('Veränderung',sgn(ch,0),`von ${eur(first,0)} auf ${eur(lastV,0)}`,`color:${ch>=0?'var(--ok)':'var(--red)'}`)}${kpi('Höchster Stand',eur(hi,0),fmtDate(hiD))}${kpi('Tiefster Stand',eur(lo,0),fmtDate(loD))}${kpi('Ø pro Monat',sgn(ch/Math.max(1,daysBetween(pts[pts.length-1][0],pts[0][0])/30.44),0),'Zu- oder Abnahme')}</div>`}}

// ----- tab: Kalender (spending per day) -----
const spendOf=t=>t.k==='ausgabe'||t.k==='erstattung'?net(t):0;
function cHeat(st){const to=today();let from=rangeFrom(st.range);if(from<firstDate())from=firstDate();
  const day={};const items={};for(const t of TX){if(t.d<from||t.d>to)continue;const v=spendOf(t);if(!v)continue;day[t.d]=(day[t.d]||0)+v;(items[t.d]=items[t.d]||[]).push(t)}
  const startDow=(new Date(from+'T12:00').getDay()+6)%7;const gridStart=addDays(from,-startDow);const all=daysRange(gridStart,to);const cols=Math.ceil(all.length/7);
  const W=1000,L=34,T=24;const cs=Math.min(30,Math.floor((W-L)/cols)-3);const gap=3;const H=T+7*(cs+gap)+6;
  const vals=Object.values(day).filter(v=>v>0).sort((a,b)=>a-b);const q=p=>vals.length?vals[Math.min(vals.length-1,Math.floor(p*vals.length))]:0;const th=[q(.25),q(.5),q(.75),q(.92)];
  const lvl=v=>v<=0?0:v<=th[0]?1:v<=th[1]?2:v<=th[2]?3:v<=th[3]?4:5;const op=[0,.18,.34,.52,.74,1];
  let g=`<svg class="chart heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ausgaben pro Tag" data-chart="heat">`;
  ['Mo','','Mi','','Fr','','So'].forEach((w,r)=>{if(w)g+=`<text x="${L-6}" y="${T+r*(cs+gap)+cs*.7}" text-anchor="end">${w}</text>`});
  let lastM='';all.forEach((d,i)=>{const c=Math.floor(i/7),r=i%7;const x=L+c*(cs+gap),y=T+r*(cs+gap);
    if(r===0||d.slice(8)==='01'){const mm=d.slice(0,7);if(mm!==lastM&&d>=from){lastM=mm;g+=`<text x="${x}" y="${T-8}">${MS[+d.slice(5,7)-1]}</text>`}}
    if(d<from)return;const v=day[d]||0;const l=lvl(v);
    g+=`<rect class="hc" x="${x}" y="${y}" width="${cs}" height="${cs}" rx="${Math.max(2,cs/6)}" data-d="${d}" fill="${l?'var(--accent)':'var(--line2)'}" ${l?`fill-opacity="${op[l]}"`:''} ${d===today()?'stroke="var(--ink)" stroke-width="1.5"':''}/>`});
  g+='</svg>';
  CH.heat={kind:'heat',day,items};
  const nd=daysRange(from,to).length;const tot=Object.values(day).reduce((a,v)=>a+v,0);const zero=daysRange(from,to).filter(d=>!(day[d]>0)).length;
  const wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];for(const d of daysRange(from,to)){const k=(new Date(d+'T12:00').getDay()+6)%7;wd[k]+=day[d]||0;wn[k]++}
  const WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];const wavg=wd.map((v,i)=>wn[i]?v/wn[i]:0);const wmax=wavg.indexOf(Math.max(...wavg));
  const topD=Object.entries(day).sort((a,b)=>b[1]-a[1])[0];
  return {head:`<div class="clbl">Ausgaben im Zeitraum</div><div class="cbig">${eur(tot,0)}</div><div class="cchg muted">Ø ${eur(tot/Math.max(1,nd))} pro Tag · ${fmtDate(from)} – heute</div>`,tools:'',
    body:g+`<div class="hlegend"><span class="muted small">weniger</span>${op.map((o,i)=>`<i style="background:${i?'var(--accent)':'var(--line2)'};opacity:${i?o:1}"></i>`).join('')}<span class="muted small">mehr</span><span class="muted small" style="margin-left:auto">Tag anklicken = Buchungen an diesem Tag</span></div>`,
    kpis:`<div class="kpis row4">${kpi('Ø pro Tag',eur(tot/Math.max(1,nd)),`${nd} Tage`)}${kpi('Tage ohne Ausgaben',String(zero),`${pct(zero/Math.max(1,nd))} der Tage`)}${kpi('Teuerster Wochentag',WDL[wmax],`Ø ${eur(wavg[wmax])}`)}${kpi('Teuerster Tag',topD?eur(topD[1],0):'–',topD?fmtDate(topD[0]):'')}</div>`}}

// ----- tab: Monate (bars) -----
function cBars(st){const to=today();let from=rangeFrom(st.range);if(from<firstDate())from=firstDate();const weekly=['1M','3M'].includes(st.range);
  const buckets=[];if(weekly){let s=addDays(from,-((new Date(from+'T12:00').getDay()+6)%7));while(s<=to){const e=addDays(s,6);buckets.push({from:s,to:e,l:fmtShort(s)});s=addDays(s,7)}}
  else{let s=from.slice(0,7)+'-01';while(s<=to){const [y,m]=s.split('-').map(Number);buckets.push({from:s,to:`${s.slice(0,7)}-${pad(dim(y,m))}`,l:monLab(s),y,m});s=addMonths(s,1)}}
  for(const b of buckets){const l=TX.filter(t=>t.d>=b.from&&t.d<=b.to);const s=stats(l);Object.assign(b,{lauf:s.lauf,einm:s.einm,inc:s.inc,aus:s.aus,fix:Math.max(0,s.hFix),vr:Math.max(0,s.hVar),ein:Math.max(0,s.hEin)})}
  const W=1000,H=300,L=70,Rr=18,T=16,B=34;const bud=budgetL()*(weekly?12/52:1);
  const yt=niceTicks(0,Math.max(1,...buckets.map(b=>b.fix+b.vr+b.ein),bud*1.05),5);const ymax=yt[yt.length-1];
  const bw=(W-L-Rr)/Math.max(1,buckets.length);const Y=v=>T+(1-Math.max(0,v)/ymax)*(H-T-B);
  let g=`<svg class="chart big" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ausgaben pro ${weekly?'Woche':'Monat'}" data-chart="bars">`;
  for(const v of yt){g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L-10}" y="${Y(v)+4}" text-anchor="end">${short(v)}</text>`}
  buckets.forEach((b,i)=>{const x=L+i*bw+bw*.16,w=bw*.68;
    let base=0;for(const [k,v] of [['fix',b.fix],['var',b.vr],['einm',b.ein]]){if(v<=0)continue;const y1=Y(base+v),h=Y(base)-y1;g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,h-(base?1:0))}" fill="${KCOL[k]}" rx="3"/>`;base+=v}
    if(buckets.length<=16||i%2===0)g+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${b.l}</text>`;
    g+=`<rect class="hb" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`});
  if(bud)g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(bud)}" y2="${Y(bud)}" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="${L+6}" y="${Y(bud)-6}" class="acc">Budget ${short(bud)}</text>`;
  g+='</svg>';CH.bars={kind:'bars',buckets,weekly};
  const full=buckets.filter(b=>b.to<=to||!weekly);const avg=buckets.reduce((a,b)=>a+b.lauf,0)/Math.max(1,buckets.length);
  const mx=buckets.slice().sort((a,b)=>b.aus-a.aus)[0];const mn=buckets.filter(b=>b.to<to).slice().sort((a,b)=>a.aus-b.aus)[0];
  const r3=buckets.slice(-4,-1),p3=buckets.slice(-7,-4);const a3=r3.reduce((a,b)=>a+b.lauf,0)/Math.max(1,r3.length),b3=p3.reduce((a,b)=>a+b.lauf,0)/Math.max(1,p3.length);const tr=p3.length&&b3?(a3-b3)/b3:null;
  return {head:`<div class="clbl">Ø Fixkosten + Alltag pro ${weekly?'Woche':'Monat'}</div><div class="cbig">${eur(avg,0)}</div><div class="cchg muted">${bud?`Budget ${eur(bud,0)} · `:''}${buckets.length} ${weekly?(buckets.length===1?'Woche':'Wochen'):(buckets.length===1?'Monat':'Monate')}</div>`,tools:'',

    kpis:`<div class="kpis row4">${kpi(`Ø Fixkosten + Alltag pro ${weekly?'Woche':'Monat'}`,eur(avg,0),bud?(avg>bud?`${eur(avg-bud,0)} über Budget`:`${eur(bud-avg,0)} unter Budget`):'')}${kpi(`Teuerster ${weekly?'Woche':'Monat'}`,mx?eur(mx.aus,0):'–',mx?(weekly?`ab ${fmtDate(mx.from)}`:`${MONTHS[mx.m-1]} ${mx.y}`):'')}${kpi(`Günstigster ${weekly?'Woche':'Monat'}`,mn?eur(mn.aus,0):'–',mn?(weekly?`ab ${fmtDate(mn.from)}`:`${MONTHS[mn.m-1]} ${mn.y}`):'')}${kpi('Trend Fixkosten + Alltag',tr==null?'–':(tr>0?'+':'')+pct(tr),`letzte 3 vs. 3 davor`,tr==null?'':`color:${tr>0?'var(--red)':'var(--ok)'}`)}</div>`}}

// ----- overview: everyday spending ('Alltag') per week, the last 8 weeks up to the selected month –
// unlike a running total for the month it says something on any day, also at the start of a month
function cWeeks(){const {y,m}=S.sel;const end=[monthEnd(y,m),today()].sort()[0];const N=8;
  const mon=d=>addDays(d,-((new Date(d+'T12:00').getDay()+6)%7));
  let s0=addDays(mon(end),-7*(N-1));const f0=mon(firstDate());if(s0<f0)s0=f0;
  const W=[];for(let d=s0;d<=end;d=addDays(d,7)){const e=addDays(d,6);W.push({from:d,to:e<end?e:end,v:0,part:e>end})}
  for(const t of TX){if(t.d<s0||t.d>end||klass(t)!=='var')continue;const i=Math.floor(daysBetween(t.d,s0)/7);if(W[i])W[i].v+=net(t)}
  W.forEach(w=>{w.v=r2(w.v)});
  const full=W.filter(w=>!w.part);const avg=full.length?full.reduce((a,w)=>a+w.v,0)/full.length:0;
  const B=budOn()?varBudget()*12/52:0;const ref=B||(full.length>=2?avg:0);
  const VW=420,VH=176,L=40,R=8,T=20,Bt=22;const slots=Math.max(W.length,5);const bw=(VW-L-R)/slots;const off=slots-W.length;
  const yt=niceTicks(0,Math.max(1,...W.map(w=>w.v),ref*1.08),4);const ymax=yt[yt.length-1];const Y=v=>T+(1-Math.max(0,v)/ymax)*(VH-T-Bt);
  const dm=d=>`${+d.slice(8)}.${+d.slice(5,7)}.`;
  let g=`<svg class="chart sm" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Alltagsausgaben pro Woche" data-chart="wochen">`;
  for(const v of yt)g+=`<line x1="${L}" x2="${VW-R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${short(v)}</text>`;
  W.forEach((w,j)=>{const i=j+off;const x=L+i*bw+bw*.16,bwid=bw*.68;const y1=Y(w.v);
    g+=`<rect x="${x}" y="${y1}" width="${bwid}" height="${Math.max(0,Y(0)-y1)}" rx="3" fill="var(--c1)" ${w.part?'fill-opacity=".45"':''}/>`;
    if(bw>=40&&w.v>=0.5)g+=`<text x="${x+bwid/2}" y="${y1-5}" text-anchor="middle" class="${w.part?'':'strong'}">${eur(w.v,0)}</text>`;
    g+=`<text x="${L+i*bw+bw/2}" y="${VH-6}" text-anchor="middle" class="${w.part?'strong':''}">${w.part&&w.to===today()?'jetzt':dm(w.from)}</text>`;
    g+=`<rect class="hb" x="${L+i*bw}" y="${T}" width="${bw}" height="${VH-T-Bt}" fill="transparent" data-i="${j}"/>`});
  if(ref)g+=`<line x1="${L}" x2="${VW-R}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="${B?'var(--amber)':'var(--ink3)'}" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  g+='</svg>';
  CH.wochen={kind:'wbars',weeks:W,ref,B,live:end===today()};
  const legend=`<div class="legend sm"><span><i style="background:var(--c1)"></i>Alltag pro Woche</span>${ref?`<span><i class="ln dash ${B?'amb':'gry'}"></i>${B?'Budget pro Woche':`Ø ${full.length} ${full.length===1?'Woche':'Wochen'}`} ${eur(ref,0)}</span>`:''}${W.some(w=>w.part)?`<span class="muted">heller Balken = ${end===today()?'Woche läuft noch':'Woche nur bis Monatsende'}</span>`:''}</div>`;
  return {svg:g,legend}}

function bindChart(){const wrap=$('#chartwrap');if(!wrap)return;const tip=$('#ctip');const svg=wrap.querySelector('svg[data-chart]');if(!svg)return;const id=svg.dataset.chart;const c=CH[id];if(!c)return;
  const showTip=(html,cx,cy)=>{tip.innerHTML=html;tip.hidden=false;const wr=wrap.getBoundingClientRect();let x=cx-wr.left+14,y=cy-wr.top-10;const tw=tip.offsetWidth;if(x+tw>wr.width-4)x=cx-wr.left-tw-14;tip.style.left=x+'px';tip.style.top=Math.max(0,y-tip.offsetHeight)+'px'};

    const valAt=(s,i)=>{const p=s.pts;if(!p.length)return null;const ex=p.find(q=>q[0]===i);if(ex)return ex[1];if(!c.interp||i<p[0][0]||i>p[p.length-1][0])return null;for(let k=1;k<p.length;k++){if(p[k][0]>=i){const a=p[k-1],b=p[k];return a[1]+(b[1]-a[1])*(i-a[0])/(b[0]-a[0])}}return null};
    const near=i=>{if(c.series[0].pts.some(q=>q[0]===i))return i;let best=null,bd=1e9;for(const q of c.series[0].pts){const dd=Math.abs(q[0]-i);if(dd<bd){bd=dd;best=q[0]}}return best??i};
    svg.onmousemove=ev=>{let i=idxAt(ev);if(c.series[0].dots)i=near(i);const xh=svg.querySelector('.xh');const x=c.X(i);xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');

      showTip(`<div class="tt">${c.lab?c.lab(i):i}</div>${rows.join('')}`,ev.clientX,ev.clientY)};
    svg.onclick=ev=>{if(!c.click)return;const r=c.click(idxAt(ev));if(r)showSpan(r.from,r.to)};svg.style.cursor=c.click?'pointer':'default'}
  else if(c.kind==='heat'){svg.onmousemove=ev=>{const el=ev.target.closest('.hc');if(!el){tip.hidden=true;return}const d=el.dataset.d;const v=c.day[d]||0;const it=(c.items[d]||[]).slice().sort((a,b)=>spendOf(b)-spendOf(a));
      showTip(`<div class="tt">${fmtDay(d)}</div><div><b>${v?eur(v):'keine Ausgaben'}</b></div>${it.slice(0,4).map(t=>`<div class="sm">${esc(t.t||catName(t.c))}<b>${eur(spendOf(t))}</b></div>`).join('')}${it.length>4?`<div class="sm muted">+ ${it.length-4} weitere</div>`:''}`,ev.clientX,ev.clientY)};
    svg.onclick=ev=>{const el=ev.target.closest('.hc');if(el)showSpan(el.dataset.d,el.dataset.d)}}
  else if(c.kind==='wbars'){svg.onmousemove=ev=>{const el=ev.target.closest('.hb');if(!el){tip.hidden=true;return}const w=c.weeks[+el.dataset.i];
      showTip(`<div class="tt">${fmtShort(w.from)} – ${fmtShort(w.to)}${w.part?(c.live?' (läuft noch)':' (nur bis Monatsende)'):''}</div><div><i style="background:var(--c1)"></i>Alltag<b>${eur(w.v)}</b></div>${c.ref?`<div><i style="background:transparent"></i>${c.B?'Budget pro Woche':'Ø pro Woche'}<b>${eur(c.ref)}</b></div>`:''}`,ev.clientX,ev.clientY)};
    svg.onclick=ev=>{const el=ev.target.closest('.hb');if(!el)return;const w=c.weeks[+el.dataset.i];showSpan(w.from,w.to)};svg.style.cursor='pointer'}
  else if(c.kind==='bars'){svg.onmousemove=ev=>{const el=ev.target.closest('.hb');if(!el){tip.hidden=true;return}const b=c.buckets[+el.dataset.i];
      showTip(`<div class="tt">${c.weekly?`${fmtShort(b.from)} – ${fmtShort(b.to)}`:`${MONTHS[b.m-1]} ${b.y}`}</div><div><i style="background:var(--c4)"></i>Fixkosten<b>${eur(b.fix,0)}</b></div><div><i style="background:var(--c1)"></i>Alltag<b>${eur(b.vr,0)}</b></div><div><i style="background:var(--c7)"></i>Unregelmäßig<b>${eur(b.ein,0)}</b></div><div><i style="background:transparent"></i>zusammen<b>${eur(b.fix+b.vr+b.ein,0)}</b></div>${b.inc?`<div><i style="background:transparent"></i>Einnahmen<b>${eur(b.inc,0)}</b></div>`:''}`,ev.clientX,ev.clientY)};
    svg.onclick=ev=>{const el=ev.target.closest('.hb');if(!el)return;const b=c.buckets[+el.dataset.i];if(c.weekly)showSpan(b.from,b.to);else{S.sel={y:b.y,m:b.m};Object.assign(S.filt,{q:'',k:'alle',c:'',g:'',acc:'',range:'monat'});go('tx')}}}}
function showSpan(from,to){Object.assign(S.filt,{q:'',k:'alle',c:'',g:'',acc:'',range:'span',from,to});S.sort={col:'d',dir:-1};go('tx')}

// small monthly bars for one category or area (used in the bookings header)
function miniTrend(pred){const out=[];let s=addMonths(today().slice(0,7)+'-01',-11);for(let i=0;i<12;i++){const k=s.slice(0,7);const v=TX.filter(t=>t.d.startsWith(k)&&pred(t)).reduce((a,t)=>a+(t.k==='ausgabe'||t.k==='erstattung'?net(t):t.k==='entnahme'?-t.a:t.a),0);out.push({k,v});s=addMonths(s,1)}
  const mx=Math.max(1,...out.map(o=>o.v));const W=600,H=96,bw=W/12;
  return `<svg class="chart mini" viewBox="0 0 ${W} ${H+18}" role="img" aria-label="Verlauf der letzten 12 Monate">${out.map((o,i)=>{const h=Math.max(o.v>0?2:0,(H-6)*Math.max(0,o.v)/mx);return `<rect x="${i*bw+bw*.18}" y="${H-h}" width="${bw*.64}" height="${h}" rx="3" fill="${o.k===today().slice(0,7)?'var(--accent)':'var(--c3)'}"><title>${MONTHS[+o.k.slice(5)-1]} ${o.k.slice(0,4)}: ${eur(o.v,0)}</title></rect><text x="${i*bw+bw/2}" y="${H+14}" text-anchor="middle">${MS[+o.k.slice(5)-1]}</text>`}).join('')}</svg>`}

// ---------- money flow (Sankey): income → total → fixed / variable / one-off / invested / left over → categories ----------
// Money flow (Sankey) like a household budget poster: incomes → Verfügbar → areas (or fixed/variable/one-off) → every category
function flowSvg(list,ctx){const by=!simple()&&S.flowBy==='art'?'art':'bereich';const inc={},spar={},out={};
  const gOf=t=>by==='art'?klass(t):(cat(t.c)?.group||'Sonstiges');
  for(const t of list){if(t.k==='einnahme'){inc[t.c]=(inc[t.c]||0)+t.a;continue}if(t.k==='sparen'){spar[t.c]=(spar[t.c]||0)+t.a;continue}if(t.k==='entnahme'){spar[t.c]=(spar[t.c]||0)-t.a;continue}
    const k=klass(t);if(k!=='fix'&&k!=='var'&&k!=='einm')continue;const v=net(t);if(!v)continue;const g=gOf(t);(out[g]=out[g]||{})[t.c]=(out[g][t.c]||0)+v}
  const spIn=Object.values(spar).filter(v=>v<0).reduce((a,v)=>a-v,0);for(const c in spar)if(spar[c]<0)delete spar[c];
  const top=(o,n)=>{let a=Object.entries(o).filter(([,v])=>v>=0.5).sort((x,z)=>z[1]-x[1]);if(a.length>n+1){const r=a.slice(n);a=a.slice(0,n).concat([['',r.reduce((s,x)=>s+x[1],0),`${r.length} weitere`]])}return a};
  const yAttr=`data-y="${ctx.y}" data-m="${ctx.m||0}" data-range="${ctx.m?'monat':'jahr'}"`;
  const tint=(col,i)=>i===0?col:`color-mix(in srgb, ${col} ${Math.max(45,100-i*9)}%, var(--card))`;
  // column 0: every income
  const ICOL=['var(--c2)','var(--c7)','var(--c5)','var(--c8)','var(--c9)','var(--c6)','var(--c1)'];
  const c0=top(inc,8).map(([c,v,l],i)=>({id:'i'+(c||'more'),l:c?catName(c):l,v,col:c?ICOL[i%ICOL.length]:'var(--c10)',act:c?`data-act="cellTx" data-k="inc" data-c="${c}" ${yAttr}`:''}));
  if(spIn>=0.5)c0.push({id:'spin',l:'Aus Erspartem',v:spIn,col:'var(--save)',act:`data-act="hhShow" data-k="spar" ${yAttr}`});
  // column 2: areas (in the order of your areas) or fixed/variable/one-off – column 3: every category in it
  const groups=by==='art'?['fix','var','einm'].filter(k=>out[k]):[...new Set([...(D.settings.groups||[]).filter(g=>out[g]),...Object.keys(out)])];
  const gcol=g=>by==='art'?KCOL[g]:GCOL[Math.max(0,(D.settings.groups||[]).indexOf(g))%10];
  const c2=[],c3=[];
  const addGroup=(id,label,col,cats,act,kk)=>{const cs=top(cats,14);const sum=cs.reduce((a,x)=>a+x[1],0);if(sum<0.5)return;
    c2.push({id,l:label,v:sum,col,act});cs.forEach(([c,v,l],i)=>c3.push({id:id+'|'+(c||'more'),par:id,l:c?catName(c):l,v,col:tint(col,c?i:8),act:c?`data-act="cellTx" data-k="${kk}" data-c="${c}" ${yAttr}`:''}))};
  for(const g of groups)addGroup('g'+g,by==='art'?KL[g]:g,gcol(g),out[g],by==='art'?`data-act="hhShow" data-k="${g}" ${yAttr}`:`data-act="showGrp" data-g="${esc(g)}" ${yAttr}`,by==='art'?g:'all');
  addGroup('gspar',by==='art'?KL.spar:'Sparen & Investieren','var(--save)',spar,`data-act="hhShow" data-k="spar" ${yAttr}`,'spar');
  return drawFlow(c0,c2,c3,yAttr)}
// draws the four columns: sources → Verfügbar → groups → categories
function drawFlow(c0,c2,c3,yAttr,plan){
  const inSum=c0.reduce((a,x)=>a+x.v,0),outSum=c2.reduce((a,x)=>a+x.v,0),rest=inSum-outSum;
  if(rest>=0.5)c2.push({id:'rest',l:plan&&!budOn()?'Frei für Alltag & Rest':plan?'Bleibt übrig':'Übrig',v:rest,col:'var(--c3)',act:''});
  else if(rest<=-0.5)c0.push({id:'minus',l:plan?'Fehlt (mehr verplant)':'Minus (mehr ausgegeben)',v:-rest,col:'var(--red)',act:''});
  if(!c0.length&&!c2.length)return empty(plan?'Noch kein Plan: trag im Budget dein Einkommen ein und leg fixe Zahlungen an.':'Noch keine Einnahmen oder Ausgaben in diesem Zeitraum.');
  const total=Math.max(inSum,outSum);const c1=[{id:'mid',l:'Verfügbar',v:total,col:'var(--ink2)',act:plan?'':`data-act="hhShow" data-k="inc" ${yAttr}`}];
  // layout: the money scale is fixed, small blocks get at least one text line of room (like the big poster charts)
  const cols=[c0,c1,c2,c3];const W=1000,NW=14,PAD=30,L=12,R=236;const MIN=[38,0,38,19],GAP=[10,0,8,3];
  const xs=[L,0,0,W-R-NW];xs[1]=L+(xs[3]-L)*0.37;xs[2]=L+(xs[3]-L)*0.7;
  const kv=Math.max(280,Math.min(560,140+c3.length*14))/Math.max(1,total);
  const ext=cols.map((c,ci)=>c.reduce((a,n)=>a+Math.max(MIN[ci],Math.max(3,n.v*kv)),0)+GAP[ci]*Math.max(0,c.length-1));const H=Math.max(300,...ext)+2*PAD;
  cols.forEach((c,ci)=>{let y=(H-ext[ci])/2;c.forEach(n=>{const h=Math.max(3,n.v*kv),slot=Math.max(MIN[ci],h);n.x=xs[ci];n.h=h;n.y=y+(slot-h)/2;n.oi=0;n.oo=0;y+=slot+GAP[ci]})});
  const byId=Object.fromEntries(cols.flat().map(n=>[n.id,n]));const links=[];
  const link=(a,b,v,col)=>{const h=Math.max(1,v*kv);const y0=a.y+a.oo,y1=b.y+b.oi;a.oo+=h;b.oi+=h;links.push({x0:a.x+NW,y0,x1:b.x,y1,h,col,t:`${a.l} → ${b.l}: ${eur(v,0)}`})};
  for(const n of c0)link(n,c1[0],n.v,n.col);for(const n of c2)link(c1[0],n,n.v,n.col);for(const n of c3)link(byId[n.par],n,n.v,n.col);
  const band=l=>{const xm=(l.x0+l.x1)/2;return `M${l.x0},${l.y0}C${xm},${l.y0} ${xm},${l.y1} ${l.x1},${l.y1}L${l.x1},${l.y1+l.h}C${xm},${l.y1+l.h} ${xm},${l.y0+l.h} ${l.x0},${l.y0+l.h}Z`};
  const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
  // incomes: name and amount to the right of the block; areas: to the left (two lines each); Budget: above; categories: one line on the right
  const label=(n,ci)=>{const y=n.y+n.h/2;
    if(ci===1)return `<text x="${n.x+NW/2}" y="${n.y-10}" text-anchor="middle" class="halo"><tspan class="nm b">${esc(n.l)}</tspan><tspan class="am" dx="6">${eur(n.v,0)}</tspan></text>`;
    if(ci===3)return `<text x="${n.x+NW+8}" y="${y}" dy=".35em" class="sm"><tspan class="nm">${esc(cut(n.l,30))}</tspan><tspan class="am" dx="6">${eur(n.v,0)}</tspan></text>`;
    const left=ci===2,x=left?n.x-8:n.x+NW+8;
    return `<text text-anchor="${left?'end':'start'}" class="halo"><tspan class="nm b" x="${x}" y="${y-3}">${esc(cut(n.l,left?26:30))}</tspan><tspan class="am" x="${x}" y="${y+13}">${eur(n.v,0)}${total&&n.id!=='mid'?` · ${pct(n.v/total)}`:''}</tspan></text>`};
  return `<div class="flowwrap"><svg class="sankey" viewBox="0 0 ${W} ${Math.round(H)}" role="img" aria-label="Finanzfluss: woher das Geld kam und wohin es ging">
   ${links.map(l=>`<path class="lnk" d="${band(l)}" fill="${l.col}"><title>${esc(l.t)}</title></path>`).join('')}
   ${cols.map(c=>c.map(n=>`<rect ${n.act} x="${n.x}" y="${n.y}" width="${NW}" height="${n.h}" rx="3" fill="${n.col}" class="${n.act?'click':''}"><title>${esc(n.l)}: ${eur(n.v,0)}${total?` (${pct(n.v/total)})`:''}</title></rect>`).join('')).join('')}
   ${cols.map((c,ci)=>c.map(n=>label(n,ci)).join('')).join('')}
  </svg></div>`}
// the plan for a month, like the Finanzfluss budget poster: planned income → fixed costs, savings plans, everyday budget → what is left
function planFlow(ctx){const {y,m}=ctx;const yAttr='';const c0=[],c2=[],c3=[];
  const ICOL=['var(--c2)','var(--c7)','var(--c5)','var(--c8)','var(--c9)','var(--c6)'];
  incomeSrc(y,m).concat(subIncomeSrc(y,m)).filter(r=>r.v>=0.5).forEach((r,k)=>c0.push({id:'i'+k,l:r.name,v:r.v,col:ICOL[k%ICOL.length],act:''}));
  if(!c0.length)activeIncome().forEach(([,x],k)=>c0.push({id:'is'+k,l:x.name,v:subMonthly(x),col:ICOL[k%ICOL.length],act:''}));
  const tint=(col,i)=>i===0?col:`color-mix(in srgb, ${col} ${Math.max(45,100-i*9)}%, var(--card))`;
  const grp=(id,l,col,items,act)=>{const its=items.filter(x=>x[1]>=0.5).sort((a,b)=>b[1]-a[1]);const sum=its.reduce((a,x)=>a+x[1],0);if(sum<0.5)return;c2.push({id,l,v:sum,col,act});its.forEach(([n,v],i)=>c3.push({id:id+'|'+i,par:id,l:n,v,col:tint(col,i),act:''}))};
  const fx={};for(const [,x] of activeSubs()){const n=catName(x.c);fx[n]=(fx[n]||0)+subMonthly(x)}
  grp('gfix','Fixkosten',KCOL.fix,Object.entries(fx),'data-act="nav" data-view="subs"');
  const sp={};for(const [,x] of activePlans()){const n=x.name||catName(x.c);sp[n]=(sp[n]||0)+subMonthly(x)}
  grp('gspar','Sparpläne','var(--save)',Object.entries(sp),'data-act="nav" data-view="subs"');
  const bm=budMode();const VG=varGroups();
  const al=bm==='gesamt'?[['Alltag gesamt',varBudget()]]:bm==='bereiche'?VG.map(g=>[g,gBud(g)]):bm==='detail'?lCats().filter(c=>isVar(c)&&cBud(c)>0).map(c=>[c.name,cBud(c)]):[];
  grp('galltag','Alltag (Budget)',KCOL.var,al,'data-act="nav" data-view="budget"');
  return drawFlow(c0,c2,c3,yAttr,true)}
function flowCard(list,title,ctx){const by=S.flowBy==='art'?'art':'bereich';const sm=simple();const canPlan=!!ctx.m&&!sm;const view=canPlan&&S.flowView==='plan'?'plan':'ist';
  const booked=list.filter(t=>t.k==='einnahme').reduce((a,t)=>a+t.a,0),planned=canPlan?incomeFor(ctx.y,ctx.m):0,gap=planned-booked;
  const hint=canPlan&&view==='ist'&&gap>=0.5?`<p class="small muted flowhint">Gebucht sind ${eur(booked,0)} Einnahmen, geplant ${eur(planned,0)} – ${eur(gap,0)} fehlen noch. <button type="button" class="link" data-act="distSet" data-k="flowView" data-v="plan">Plan ansehen</button>${isCur()||mkey(ctx.y,ctx.m)<today().slice(0,7)?` · <button type="button" class="link" data-act="incBook" data-y="${ctx.y}" data-m="${ctx.m}" data-v="${r2(gap)}">${eur(gap,0)} als Buchung eintragen</button>`:''}</p>`:'';
  const desc=view==='plan'?'Dein Plan aus dem Budget: Einnahmen, fixe Zahlungen, Sparpläne und Alltag.':'Was gebucht ist – von den Einnahmen bis zur einzelnen Kategorie. Klick auf einen Block zeigt die Buchungen.';
  const tabs=canPlan?`<div class="seg" role="tablist" aria-label="Ansicht">${[['ist','Tatsächlich'],['plan','Geplant']].map(([v,l])=>`<button type="button" role="tab" data-act="distSet" data-k="flowView" data-v="${v}" aria-selected="${view===v}" aria-pressed="${view===v}">${l}</button>`).join('')}</div>`:'';
  const group=sm?'':view==='ist'?`<label class="flowby"><span>Rechts nach</span><select class="inp sm" id="flowBy" aria-label="Rechts gruppiert nach"><option value="bereich" ${by==='bereich'?'selected':''}>Bereichen</option><option value="art" ${by==='art'?'selected':''}>Fix · Alltag · Unregelmäßig</option></select></label>`:'';
  return `<section class="card flowcard" id="flow"><div class="sec-h flowhead"><div><h2>${title}</h2><span class="small muted">${desc}</span></div><div class="flowctl">${group}${tabs}</div></div>${hint}${view==='plan'?planFlow(ctx):flowSvg(list,ctx)}</section>`}

// ---------- import of bank exports (CSV) ----------
// Reads the CSV export of a bank (Trade Republic "Transaktionsexport", George/Erste, others), finds the columns,
// cleans merchant names, suggests categories, recognises transfers between own accounts and bookings that already
// exist, and shows everything for review before anything is saved.

function decodeFile(buf){let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\uFFFD'))t=new TextDecoder('windows-1252').decode(buf);return t.replace(/^\uFEFF/,'')}
function parseCSV(text){const first=text.split(/\r?\n/).slice(0,6).join('\n');
  const delim=[';',',','\t','|'].map(d=>[d,(first.match(new RegExp(d==='|'?'\\|':d==='\t'?'\\t':d,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&cell.trim()===''){q=true;cell='';continue}
    if(ch===delim){row.push(cell);cell='';continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[];continue}
    cell+=ch}
  if(cell!==''||row.length){row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row)}
  return {delim,rows:rows.map(r=>r.map(c=>c.trim()))}}

const COLS={
  date:['buchungsdatum','buchungstag','date','datum','transaktionsdatum','booking date','bookingdate','datetime','valutadatum','valuta','wertstellung','value date'],
  amount:['betrag','amount','umsatz','betrag in eur','betrag eur','betrag (eur)','value','summe','amount eur'],
  credit:['haben','gutschrift','eingang','zahlungseingang','credit','einnahme'],
  debit:['soll','belastung','ausgang','zahlungsausgang','debit','ausgabe'],
  fee:['fee','gebuehr','gebühr','spesen','fees'],
  tax:['tax','steuer','steuern'],
  partner:['partnername','partner name','name','empfaenger','empfänger','auftraggeber','zahlungsempfaenger','zahlungsempfänger','counterparty','counterparty name','merchant','haendler','händler','beguenstigter','begünstigter','auftraggeber/empfaenger','partner'],
  text:['buchungstext','verwendungszweck','beschreibung','description','text','zahlungsreferenz','buchungs-info','buchungsinfo','reference','details','zweck','memo','title','notiz'],
  type:['type','typ','art','transaktionsart','category','subtype','umsatzart'],
  id:['transaction_id','transaktions-id','transaktionsid','id','buchungsreferenz','referenz','reference id','ersterfassungsreferenz'],
  isin:['isin','symbol','wkn'],
  currency:['currency','waehrung','währung']};
const nh=h=>norm(h).replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
function findHeader(rows){for(let i=0;i<Math.min(rows.length,15);i++){const r=rows[i];const named=r.filter(c=>c&&!/^[-+]?[\d.,\s€]+$/.test(c)).length;if(r.length>=3&&named>=3&&r.some(c=>COLS.date.includes(nh(c))||COLS.amount.includes(nh(c))||/datum|date|betrag|amount/i.test(c)))return i}return 0}
function guessMap(header){const H=header.map(nh);const pick=(key,avoid=[])=>{for(const syn of COLS[key]){const i=H.findIndex((h,ix)=>h===nh(syn)&&!avoid.includes(ix));if(i>=0)return i}for(const syn of COLS[key]){const i=H.findIndex((h,ix)=>h.includes(nh(syn))&&!avoid.includes(ix));if(i>=0)return i}return -1};
  const m={date:pick('date'),amount:pick('amount'),credit:-1,debit:-1,fee:pick('fee'),tax:pick('tax'),partner:pick('partner'),text:-1,type:pick('type'),id:pick('id'),isin:pick('isin'),currency:pick('currency')};
  if(m.amount<0){m.credit=pick('credit');m.debit=pick('debit')}
  const used=[m.date,m.amount,m.partner,m.fee,m.tax,m.type,m.id,m.isin,m.currency].filter(i=>i>=0);m.text=pick('text',used);
  // a "type" column is only useful if it is not the same as the partner or text column
  if(m.type===m.partner||m.type===m.text)m.type=-1;
  // TR has date and datetime: prefer the plain date
  const di=H.indexOf('date');if(di>=0)m.date=di;return m}
const sigOf=header=>header.map(nh).join('|');
function guessAcc(header,name){const H=header.map(nh).join(' ');const n=norm(name);const accs=D.settings.accounts||[];const find=re=>accs.find(a=>re.test(norm(a)));
  if(/isin|shares|subtype|transaction id/.test(H)||/trade|republic|transaktionsexport/.test(n))return find(/trade|republic/)||'';
  if(/partner iban|partnername|buchungs ?info/.test(H)||/george|erste|sparkasse|at\d{2}2011/.test(n))return find(/erste|george|sparkasse/)||'';
  return ''}

function parseDateAny(s){s=(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return `${m[3]}-${pad(+m[1])}-${pad(+m[2])}`;
  return null}
function parseNum(s){s=String(s||'').replace(/[€\s\u00a0]|EUR/gi,'');if(!s)return NaN;let neg=false;if(/-$/.test(s)){neg=true;s=s.slice(0,-1)}if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  const v=Number(s);return isFinite(v)?(neg?-Math.abs(v):v):NaN}
// turn bank text into a readable merchant name
function cleanText(partner,text){const raw=[partner,text].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  let s=(partner&&partner.length>2&&!/^(paypal|visa|mastercard|sumup)/i.test(partner)?partner+' '+(text||''):raw);
  // Erste/George card lines: "E-COMM 2,99 IE K1 26.10. 00:00 APPLE.COM/BILL CORK 372"
  const card=raw.match(/(?:E-COMM|POS|ATM|BANKOMAT|KARTE)\s+[\d.,]+\s+[A-Z]{2,3}\s+K\d\s+\d{1,2}\.\d{1,2}\.?\s+\d{1,2}:\d{2}\s+(.+)$/i);if(card)s=card[1];
  s=s.replace(/\b(Kartenzahlung|Kartentransaktion|Card transaction|Card payment|POS|E-COMM|E-Commerce|Lastschrift|SEPA[- ]?(Lastschrift|Gutschrift|Überweisung)?|Bezahlung Karte|Maestro|Debit|K\d)\b/gi,' ')
   .replace(/\b\d{1,2}\.\d{1,2}\.(\d{2,4})?(?=\s|$)/g,' ').replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g,' ').replace(/\b\d+[.,]\d{2}\b/g,' ')
   .replace(/\b[A-Z0-9]*\d[A-Z0-9]{7,}\b/g,' ').replace(/\b\d{5,}\b/g,' ').replace(/[*#]+/g,' ').replace(/\s{2,}/g,' ').trim();
  // use the name you already use for this merchant, e.g. "BILLA DANKT 1200" -> "Billa", "APPLE.COM/BILL" -> "Apple"
  const n=' '+norm(s).replace(/[^a-z0-9&]+/g,' ')+' ';let best=null,bl=0;
  for(const m of MERCH.slice(0,400)){const kk=norm(m.t).replace(/[^a-z0-9&]+/g,' ').trim();if(kk.length<3)continue;if(n.includes(' '+kk+' ')&&kk.length>bl){best=m.t;bl=kk.length}}
  if(best)return best;
  s=s.replace(/\b(DANKT|SAGT DANKE|DANKE|FILIALE|FIL\.?|ATM|GMBH|AG)\b/gi,' ').replace(/\b[\w-]+\.(com|at|de|eu|net|org)\b/gi,m=>m.split('.')[0]).replace(/\b(AT|DE|LU|IE|NL|GB|FR|IT|ES|CH)\b/g,' ').replace(/(\s\d+)+$/,'').replace(/\s{2,}/g,' ').trim();
  if(s.length<2)s=raw.slice(0,40);
  if(s===s.toUpperCase()&&/[A-Z]{3}/.test(s))s=s.toLowerCase().replace(/(^|[\s\-\/(&'.])([a-zäöü])/g,(m,a,b)=>a+b.toUpperCase());
  return s.slice(0,60)}

// one-to-one matching against bookings that already exist (same account, same amount, date ±3 days)
function matchExisting(items,acc){const pool=TX.filter(t=>t.acc===acc||!t.acc||t.acc2===acc);const used=new Set();
  const byExt=new Map(TX.filter(t=>t.ext).map(t=>[t.ext,t]));
  for(const it of items){if(it.ext&&byExt.has(it.ext)){it.dup=byExt.get(it.ext);used.add(it.dup.id);continue}}
  const sorted=items.filter(i=>!i.dup).slice().sort((a,b)=>a.d.localeCompare(b.d));
  for(const it of sorted){let best=null,score=1e9;
    for(const t of pool){if(used.has(t.id))continue;const sa=t.k==='umbuchung'?(t.acc2===acc?t.a:-t.a):(t.k==='ausgabe'||t.k==='sparen')?-t.a:t.a;if(Math.abs(sa-it.amt)>=0.005)continue;const dd=Math.min(Math.abs(daysBetween(t.bd||t.d,it.d0||it.d)),Math.abs(daysBetween(t.d,it.d)));if(dd>3)continue;
      const s=dd*10+(merchantKey(t.t)&&merchantKey(t.t)===merchantKey(it.t)?0:5)+(t.acc===acc||t.acc2===acc?0:3);if(s<score){score=s;best=t}}
    if(best){it.dup=best;used.add(best.id)}}}

function buildItems(imp){const {rows,hi,map,acc,own}=imp;const ownN=norm(own||'').trim();const out=[];
  for(let r=hi+1;r<rows.length;r++){const row=rows[r];const g=i=>i>=0?(row[i]||''):'';
    const d=parseDateAny(g(map.date));if(!d)continue;
    let amt=map.amount>=0?parseNum(g(map.amount)):(()=>{const c=parseNum(g(map.credit)),de=parseNum(g(map.debit));return (isFinite(c)?Math.abs(c):0)-(isFinite(de)?Math.abs(de):0)})();
    if(!isFinite(amt))continue;const fee=parseNum(g(map.fee)),tax=parseNum(g(map.tax));if(isFinite(fee)&&fee)amt+=fee<0?fee:-Math.abs(fee);if(isFinite(tax)&&tax)amt+=tax<0?tax:-Math.abs(tax);
    const extra=r2((isFinite(fee)?Math.abs(fee):0)+(isFinite(tax)?Math.abs(tax):0));amt=r2(amt);if(!amt)continue;
    const partner=g(map.partner),text=g(map.text),type=g(map.type),isin=g(map.isin);const all=norm([partner,text,type].join(' '));
    let k=amt<0?'ausgabe':'einnahme',c='',status='neu',why='',t=cleanText(partner,text||type),wd=0;
    if(ownN&&all.includes(ownN)){status='intern';why='Überweisung zwischen deinen Konten'}
    // cash withdrawal: not an expense, only what is bought with it counts. A withdrawal fee is booked on its own.
    else if(amt<0&&CASH_RE.test(all)){if(extra>0&&extra<-amt){wd=r2(-amt-extra);amt=-extra;c=cat('gebuehren')?'gebuehren':cat('sonstiges')?'sonstiges':'';t='Gebühr '+t}else{status='bargeld';why='abgehoben – keine Ausgabe, wird nicht gebucht'}}
    else if(/zins|interest/.test(all)&&amt>0){c=cat('zinsen')?'zinsen':'';}
    else if(/saveback|cashback|bonus/.test(all)&&amt>0){c=cat('zinsen')?'zinsen':cat('sonst_ein')?'sonst_ein':''}
    else if(isin||/sparplan|savings ?plan|\bbuy\b|\bkauf\b|wertpapier|order/.test(all)){if(amt<0){k='sparen';c=cat('etf')?'etf':''}else{k='entnahme';c=cat('etf')?'etf':''}}
    if(!c){const si=suggestInfo(t,k)||suggestInfo([partner,text].join(' '),k);c=si?si.c:''}
    if(k==='einnahme'&&!c){const s2=suggestInfo(t,'ausgabe');if(s2){k='erstattung';c=s2.c}}
    // salary at the end of a month counts for the next one (setting under Einstellungen); the bank date stays in the note
    let d0=null;if(k==='einnahme'&&status==='neu'){const nd=salaryDate(d,c,t+' '+partner+' '+text);if(nd){d0=d;why=`Gehalt vom ${fmtDate(d).replace(/ \d{4}$/,'')} – zählt für ${MONTHS[+nd.slice(5,7)-1]}`}}
    out.push({r,d:d0?salaryDate(d0,c,t+' '+partner+' '+text):d,d0,amt,a:Math.abs(amt),wd,k,c,t,raw:[partner,text,type].filter(Boolean).join(' · ').slice(0,200),ext:g(map.id)||null,status,why,on:status==='neu'})}
  matchExisting(out,acc);
  for(const it of out){if(it.dup&&(it.status==='neu'||it.status==='bargeld')){it.status='vorhanden';it.on=false}}
  return out}

function readImportFile(file){const rd=new FileReader();rd.onload=()=>{try{const text=decodeFile(new Uint8Array(rd.result));
    if(/^%PDF/.test(text.slice(0,8))){toast('Das ist eine PDF. Bitte den CSV-Export der Bank verwenden – wie das geht, steht links.');return}
    const {rows,delim}=parseCSV(text);if(rows.length<2){toast('In der Datei wurden keine Zeilen gefunden.');return}
    const hi=findHeader(rows);const header=rows[hi];const sig=sigOf(header);const saved=(D.settings.importMaps||{})[sig];
    const map=saved?Object.assign(guessMap(header),saved.map):guessMap(header);const acc=saved?.acc||guessAcc(header,file.name)||'';
    S.imp={name:file.name,rows,hi,header,sig,delim,map,acc,own:D.settings.ownName||'',filter:'neu'};S.imp.items=impReady()?buildItems(S.imp):[];render()}
  catch(e){console.error(e);toast('Die Datei konnte nicht gelesen werden: '+e.message)}};rd.readAsArrayBuffer(file)}
const impReady=()=>{const m=S.imp.map;return m.date>=0&&(m.amount>=0||m.credit>=0||m.debit>=0)&&!!S.imp.acc};

function vImport(){const im=S.imp;
  if(!im)return `<div class="split wide"><section class="card drop" id="drop" tabindex="0">
    <div class="dropin"><div class="dicon">⤓</div><h3>Kontoauszug als CSV hierher ziehen</h3><p class="muted">oder</p><label class="btn pri">Datei auswählen<input type="file" id="impFile" accept=".csv,.txt,text/csv" hidden></label>
    <p class="small muted">Die Datei wird nur gelesen, nicht verändert. Vor dem Speichern siehst du jede Buchung und kannst sie anpassen.</p></div></section>
   <aside class="stack"><div class="card"><h2>So bekommst du die Datei</h2>

    <p class="small muted">PDF-Kontoauszüge kann die App nicht lesen – nimm immer den CSV-Export. Die Menüs können je nach App-Version etwas anders heißen.</p></div>
    <div class="card"><h2>Was die App erkennt</h2><ul class="keys"><li>Buchungen, die schon drin sind (auch automatisch gebuchte Abos)</li><li>Überweisungen zwischen deinen eigenen Konten</li><li>Bargeld-Abhebungen – werden nicht gebucht, als Ausgabe zählt erst, was du bar kaufst</li><li>Zinsen, Sparpläne und Wertpapierkäufe</li><li>Kategorie über deine bisherigen Buchungen und Regeln</li></ul></div></aside></div>`;
  const H=im.header;const opt=(sel,none)=>`${none?`<option value="-1">${none}</option>`:''}${H.map((h,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(h||('Spalte '+(i+1)))}</option>`).join('')}`;
  const m=im.map;const ready=impReady();const it=im.items||[];
  const cnt={neu:it.filter(x=>x.status==='neu').length,vorhanden:it.filter(x=>x.status==='vorhanden').length,intern:it.filter(x=>x.status==='intern').length,bargeld:it.filter(x=>x.status==='bargeld').length};const on=it.filter(x=>x.on);
  const range=it.length?`${fmtDate(it.map(x=>x.d).sort()[0])} – ${fmtDate(it.map(x=>x.d).sort().pop())}`:'';
  const shown=it.filter(x=>im.filter==='alle'||x.status===im.filter);
  const noCat=on.filter(x=>!x.c).length;
  return `<section class="card"><div class="sec-h"><div><h2>Datei</h2><div><b>${esc(im.name)}</b> <span class="muted small">· ${im.rows.length-im.hi-1} Zeilen${range?` · ${range}`:''}</span></div></div><button type="button" class="btn ghost" data-act="impReset">Andere Datei</button></div>
   <div class="mapgrid">
    <label class="fl"><span>Konto</span><select class="inp ${im.acc?'':'hl'}" id="im-acc">${accOptions(im.acc,'– welches Konto? –')}</select></label>
    <label class="fl"><span>Datum</span><select class="inp ${m.date<0?'hl':''}" data-map="date">${opt(m.date,'– wählen –')}</select></label>
    ${m.amount>=0||(m.credit<0&&m.debit<0)?`<label class="fl"><span>Betrag</span><select class="inp ${m.amount<0?'hl':''}" data-map="amount">${opt(m.amount,'– getrennte Spalten –')}</select></label>`:
     `<label class="fl"><span>Eingang</span><select class="inp" data-map="credit">${opt(m.credit,'–')}</select></label><label class="fl"><span>Ausgang</span><select class="inp" data-map="debit">${opt(m.debit,'–')}</select></label>`}

function bindImport(){const f=$('#impFile');if(f)f.onchange=()=>{if(f.files[0])readImportFile(f.files[0])};
  const drop=$('#drop');if(drop){drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');const fl=e.dataTransfer.files[0];if(fl)readImportFile(fl)}}
  const im=S.imp;if(!im)return;const rebuild=()=>{im.items=impReady()?buildItems(im):[];render()};
  $$('[data-map]').forEach(s=>s.onchange=()=>{im.map[s.dataset.map]=+s.value;if(s.dataset.map==='amount'&&+s.value<0){im.map.credit=im.map.credit??-1;im.map.debit=im.map.debit??-1}rebuild()});
  const a=$('#im-acc');if(a)a.onchange=()=>{im.acc=a.value;rebuild()};
  const o=$('#im-own');if(o)o.onchange=()=>{im.own=o.value.trim();rebuild()};
  $$('[data-imp-on]').forEach(c=>c.onchange=()=>{im.items[+c.dataset.impOn].on=c.checked;render()});
  $$('[data-imp-t]').forEach(c=>c.onchange=()=>{const x=im.items[+c.dataset.impT];x.t=c.value.trim();if(!x.cManual){const s=suggest(x.t,x.k);if(s){x.c=s;render()}}});
  $$('[data-imp-k]').forEach(c=>c.onchange=()=>{const x=im.items[+c.dataset.impK];x.k=c.value;if(!catsForKind(x.k).some(y=>y.id===x.c))x.c=suggest(x.t,x.k)||(x.k==='sparen'||x.k==='entnahme'?(cat('etf')?'etf':''):'');render()});
  $$('[data-imp-c]').forEach(c=>c.onchange=()=>{const x=im.items[+c.dataset.impC];x.c=c.value;x.cManual=true;render()})}
function saveImport(){const im=S.imp;const sel=im.items.filter(x=>x.on);if(!sel.length)return;if(sel.some(x=>!x.c)){toast('Bitte allen ausgewählten Buchungen eine Kategorie geben.');return}
  const acc=im.acc;const maxD=sel.map(x=>x.d).sort().pop();
  mut(()=>{for(const x of sel)upsertTx({d:x.d,bd:x.d0&&x.d0!==x.d?x.d0:undefined,a:x.a,k:x.k,c:x.c,t:x.t,acc,src:'import',ext:x.ext||undefined,note:x.wd?`Abhebegebühr (abgehoben: ${eur(x.wd)})`:x.d0&&x.d0!==x.d?`Am Konto am ${fmtDate(x.d0)} – zählt für ${MONTHS[+x.d.slice(5,7)-1]}`:null});
    D.settings.importMaps=D.settings.importMaps||{};D.settings.importMaps[im.sig]={map:im.map,acc};if(im.own)D.settings.ownName=im.own;
    D.meta.importedThrough=D.meta.importedThrough||{};if(!D.meta.importedThrough[acc]||maxD>D.meta.importedThrough[acc])D.meta.importedThrough[acc]=maxD},
    `${sel.length} ${sel.length===1?'Buchung':'Buchungen'} von ${acc} übernommen`);
  S.imp=null;S.entryMode='hand';Object.assign(S.filt,{q:'',k:'alle',c:'',g:'',acc,range:'span',from:sel.map(x=>x.d).sort()[0],to:maxD});go('tx')}

function openDrawer(title,body,foot,bind){const d=$('#drawer');drawerReturn=document.activeElement;

  d.hidden=false;$('#scrim').hidden=false;S.drawer=true;d.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer);
  d.onkeydown=e=>{if(e.key!=='Tab')return;const f=[...d.querySelectorAll('button,input,select,textarea,[tabindex]')].filter(x=>!x.disabled&&x.offsetParent!==null&&x.tabIndex>=0);if(!f.length)return;
    const i=f.indexOf(document.activeElement);if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}};
  if(bind)bind(d);setTimeout(()=>{const f=d.querySelector('[autofocus]')||d.querySelector('.dbody input:not([type=checkbox]),.dbody select');if(f){f.focus();if(f.select)try{f.select()}catch(e){}}},30)}
function closeDrawer(){const d=$('#drawer');if(!d||d.hidden)return;d.hidden=true;d.innerHTML='';$('#scrim').hidden=true;S.drawer=false;if(drawerReturn&&drawerReturn.isConnected)try{drawerReturn.focus()}catch(e){}}
function armDelete(btn,fn,ask){if(!btn)return;const lbl=btn.textContent;let arm=false,tm;btn.onclick=()=>{if(!arm){arm=true;btn.textContent=ask||'Wirklich löschen?';btn.classList.add('armed');tm=setTimeout(()=>{arm=false;if(btn.isConnected){btn.textContent=lbl;btn.classList.remove('armed')}},4000);return}clearTimeout(tm);fn()}}

// ---------- restore from a backup ----------
// the daily copies in Daten\Backups (newest first), each with its number of bookings
async function listBackups(dir){const out=[];try{const b=await dir.getDirectoryHandle('Backups');for await(const [n,h] of b.entries()){if(h.kind!=='file'||!/^kassabuch-.*\.json$/.test(n))continue;out.push({n,h})}}catch(e){}
  return out.sort((a,b)=>b.n.localeCompare(a.n))}
const backupLabel=n=>{const m=n.match(/(\d{4}-\d{2}-\d{2})/);const d=m?fmtDate(m[1]):n;return /archiv/.test(n)?`Archiv bis ${d}`:/vor-wieder/.test(n)?`Stand vor dem Wiederherstellen (${d})`:/defekt/.test(n)?`beschädigte Datei (${d})`:`Tageskopie ${d}`};
async function readBackup(h){const f=await h.getFile();const o=normalize(JSON.parse(await f.text()));return o}
async function restoreForm(){if(ST.mode!=='file'){toast('Wiederherstellen geht nur, wenn das Kassabuch in einem Ordner gespeichert ist.');return}
  const list=await listBackups(ST.dir);const rows=[];for(const b of list.slice(0,40)){try{const o=await readBackup(b.h);rows.push({b,n:o.tx.length,last:o.tx.map(t=>t.d).sort().pop()||''})}catch(e){rows.push({b,bad:true})}}
  openDrawer('Aus Sicherung wiederherstellen',`<p class="small">Wähl einen Stand. Dein jetziger Stand wird vorher als Kopie im Ordner „Backups“ abgelegt, und direkt danach geht es mit <b>Strg+Z</b> zurück.</p>
   ${rows.length?`<div class="mini">${rows.map((r,i)=>`<div class="mrow"><span>${esc(backupLabel(r.b.n))}<small>${r.bad?'nicht lesbar':`${r.n} Buchungen${r.last?` · letzte vom ${fmtDate(r.last)}`:''}`}</small></span>${r.bad?'':`<button type="button" class="btn sm" data-rb="${i}">Diesen Stand laden</button>`}</div>`).join('')}</div>`:'<p class="small muted">Noch keine Sicherungen im Ordner „Backups“.</p>'}
   <p class="small muted">Eine heruntergeladene Sicherungskopie (Kassabuch-Sicherung_….json) kannst du auch direkt auswählen.</p>`,
   `${window.showOpenFilePicker?'<button type="button" class="btn" id="rb-file">Datei auswählen …</button>':''}<div class="grow"></div><button type="button" class="btn" data-close>Schließen</button>`,dr=>{
    dr.querySelectorAll('[data-rb]').forEach(btn=>armDelete(btn,async()=>{const r=rows[+btn.dataset.rb];try{await restoreData(await readBackup(r.b.h),backupLabel(r.b.n))}catch(e){toast('Diese Sicherung lässt sich nicht laden: '+e.message)}},'Wirklich laden?'));
    const fb=dr.querySelector('#rb-file');if(fb)fb.onclick=async()=>{let h;try{[h]=await window.showOpenFilePicker({types:[{description:'Kassabuch-Daten',accept:{'application/json':['.json']}}]})}catch(e){return}
      try{const o=await readBackup(h);await restoreData(o,h.name)}catch(e){toast('Diese Datei ist keine lesbare Kassabuch-Sicherung: '+e.message)}}})}
async function restoreData(o,label){try{const b=await ST.dir.getDirectoryHandle('Backups',{create:true});const t=new Date();const fh=await b.getFileHandle(`kassabuch-vor-wiederherstellen-${today()}-${pad(t.getHours())}${pad(t.getMinutes())}.json`,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(D));await w.close()}
  catch(e){toast('Die Kopie des jetzigen Stands konnte nicht angelegt werden – es wurde nichts geändert.');return}
  closeDrawer();mut(()=>{D=o},`Wiederhergestellt: ${label} · ${o.tx.length} Buchungen`)}
// start screen: the file could not be read – take the newest readable daily copy, keep the broken file next to it
async function restoreLatest(){const dir=S.brokenDir;if(!dir)return;const list=await listBackups(dir);
  for(const b of list){if(/defekt/.test(b.n))continue;let txt;try{txt=await (await b.h.getFile()).text();normalize(JSON.parse(txt))}catch(e){continue}
    try{const bdir=await dir.getDirectoryHandle('Backups',{create:true});const broken=await (await (await dir.getFileHandle(DATA_FILE)).getFile()).text();const t=new Date();
      const k=await bdir.getFileHandle(`kassabuch-defekt-${today()}-${pad(t.getHours())}${pad(t.getMinutes())}.json`,{create:true});let w=await k.createWritable();await w.write(broken);await w.close();
      w=await (await dir.getFileHandle(DATA_FILE)).createWritable();await w.write(txt);await w.close()}catch(e){toast('Wiederherstellen fehlgeschlagen: '+e.message);return}
    S.loadErr=null;await openPicked(dir);toast(`${backupLabel(b.n)} geladen – die beschädigte Datei liegt in „Backups“`);return}
  toast('Keine lesbare Sicherung gefunden.')}

// ---------- Excel export (small built-in .xlsx writer, works offline) ----------
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder();const parts=[];const central=[];let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const [name,content] of files){const nb=enc.encode(name),db=typeof content==='string'?enc.encode(content):content;const crc=crc32(db);
    const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(local,nb,db);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=local.length+nb.length+db.length}
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const xlDate=iso=>{const [y,m,d]=iso.split('-').map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5};
// cell spec: string | number | {v, s:'date'|'eur'|'pct'|'b'}
function sheetXml(rows,widths,filter){const st={date:1,eur:2,b:3,pct:4};
  const body=rows.map((r,ri)=>`<row r="${ri+1}">${r.map((c,ci)=>{if(c==null||c==='')return '';const ref=colName(ci)+(ri+1);let v=c,s=ri===0?3:0;if(typeof c==='object'){v=c.v;s=st[c.s]||s}if(v==null||v==='')return '';
    if(typeof c==='object'&&c.s==='date'){return `<c r="${ref}" s="1"><v>${xlDate(v)}</v></c>`}
    if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"${s?` s="${s}"`:''}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${s?` s="${s}"`:''}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}).join('')}</row>`).join('');
  const last=colName(Math.max(0,(rows[0]||[]).length-1))+Math.max(1,rows.length);

  sheets.forEach((s,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,sheetXml(s.rows,s.widths,s.filter)]));

  budFromFix:()=>{const by=fixMonthlyByCat();const ch=Object.entries(by).filter(([c,v])=>cat(c)&&cat(c).type==='laufend'&&(+cat(c).budget||0)<v-0.005);if(!ch.length)return;
    mut(()=>{for(const [c,v] of ch){const k=D.settings.cats.find(x=>x.id===c);if(k)k.budget=r2(v)}},`Budget angepasst: ${ch.map(([c,v])=>`${catName(c)} ${eur(v,0)}`).join(', ')}`)},
  entryMode:el=>{S.entryMode=el.dataset.m;if(S.entryMode==='hand')S.entryFocus='#e-t';render()},importNav:()=>{S.entryMode='datei';go('entry')},
  impReset:()=>{S.imp=null;render()},impFilter:el=>{S.imp.filter=el.dataset.f;render()},
  impAll:el=>{const im=S.imp;for(const x of im.items)if(im.filter==='alle'||x.status===im.filter)x.on=el.checked;render()},impSave:()=>saveImport(),
  chartTab:el=>{chartState().tab=el.dataset.t;render()},chartRange:el=>{chartState().range=el.dataset.r;render()},chartMetric:el=>{chartState().metric=el.dataset.m;render()},
  eAdd:()=>addEntry(),eMore:()=>{const e=entryState();e.more=!e.more;S.entryFocus=e.more?'#e-sp':'#e-t';render()},eDay:el=>shiftDay(+el.dataset.n),
  eHalf:()=>{const e=entryState();const a=parseAmt(e.a);if(!(a>0)){toast('Erst den Betrag eingeben');return}e.sa=amtIn(Math.round(a*50)/100);if(!e.sp&&(D.settings.people||[]).length)e.sp=D.settings.people[0];S.entryFocus='#e-sa';render()},
  eToSave:()=>{const e=entryState();e.k='sparen';e.cManual=false;e.c=(cat('etf')&&'etf')||(catsForKind('sparen')[0]||{}).id||'';S.entryFocus=parseAmt(e.a)>0?'#e-add':'#e-a';render()},
  bookDue:el=>bookDue(el.dataset.id),skipDue:el=>bookDue(el.dataset.id,true),
  resetData:()=>resetForm(),startListDone:()=>mut(()=>{D.meta.startListDone=true},null),
  goFlow:()=>{S.report='monat';go('report');setTimeout(()=>{const f=$('#flow');if(f)f.scrollIntoView({block:'start',behavior:'smooth'})},60)},
  eRepAuto:el=>{const e=entryState();e.repAuto=el.dataset.v==='1';const box=$('#e-rep-box');if(box)box.innerHTML=repBox(e)},
  eRepOnce:()=>{const e=entryState();e.rep='';e.repOk=false;const sel=$('#e-rep');if(sel)sel.value='';const box=$('#e-rep-box');if(box)box.hidden=true;addEntry()},
  // a new fixed payment is entered like any other booking, with 'Wiederholung' already set
  newFix:el=>{const e=entryState();Object.assign(e,{k:el.dataset.k||'ausgabe',t:el.dataset.n||'',c:el.dataset.c||'',cManual:!!el.dataset.c,a:'',rep:el.dataset.e?(el.dataset.e):'1',repAuto:true,repOk:false,dupOk:false});S.entryMode='hand';go('entry');S.entryFocus=e.t?'#e-a':'#e-t';render()},
  eSalary:el=>{const e=entryState();e.bd=e.d;e.d=el.dataset.d;e.dupOk=false;const d=$('#e-d');if(d)d.value=e.d;const h=$('#e-hint');if(h){h.className='ehint ok';h.innerHTML=`Datum auf ${fmtDate(e.d)} gesetzt – zählt für ${MONTHS[+e.d.slice(5,7)-1]}.`}const f=$(parseAmt(e.a)>0?'#e-add':'#e-a');if(f)f.focus()},
  eClear:()=>{const e=entryState();Object.assign(e,{t:'',a:'',c:'',cManual:false,learn:undefined,dupOk:false});S.entryFocus='#e-t';render()},
  eFill:el=>{const e=entryState();e.t=el.dataset.t;e.cManual=false;e.learn=undefined;e.c=suggest(e.t,e.k)||'';S.entryFocus='#e-a';render()},
  deposit:el=>moveForm(el.dataset.id,false),withdraw:el=>moveForm(el.dataset.id,true),
  editFund:el=>fundForm(el.dataset.id),newFund:el=>fundForm(null,el.dataset.kind),
  editSub:el=>el.dataset.id?subForm(el.dataset.id):ACT.newFix(el),addDebt:()=>debtForm(),settle:el=>settleForm(el.dataset.id),
  editCat:(el,ev)=>{if(ev)ev.stopPropagation();catForm(el.dataset.id||null)},
  delRule:el=>{const p=el.dataset.p;mut(()=>{D.rules.learned=D.rules.learned.filter(x=>x.p!==p)},'Regel entfernt')},
  addRule:()=>{const p=merchantKey($('#rp').value);const c=$('#rc').value;if(!p||p.length<3){toast('Bitte einen Händlernamen eingeben (mind. 3 Buchstaben)');return}if(!c){toast('Bitte eine Kategorie wählen');return}mut(()=>learn(p,c),'Regel gespeichert')},
  saveCheck:()=>{const cash=D.settings.cashAccounts||[];const dr=S.checkDraft||{};const bal={};for(const a of cash){const v=parseAmt(dr[a]);if(dr[a]!=null&&dr[a]!==''){if(!isFinite(v)){toast(`Bitte bei „${a}“ eine Zahl eingeben`);return}bal[a]=v}}
    if(!Object.keys(bal).length){toast('Bitte mindestens einen Kontostand eintragen');return}
    const lc=lastCheck();const d=today();let diff=null;if(lc&&cash.every(a=>bal[a]!=null&&lc.bal[a]!=null)){const fl=checkFlows(lc.d,d,cash,checkIncl(lc));diff=r2(cash.reduce((s,a)=>s+bal[a]-(lc.bal[a]+(fl.per[a]||0)),0))}
    const k=d.slice(0,7);mut(()=>{D.checks.push({id:uid('c'),d,bal,diff,ts:Date.now(),incl:inclToday(d)});if(S.checkWealth!==false&&mod('wealth')){const w=D.wealth[k]=D.wealth[k]||{v:{}};Object.assign(w.v,bal)}},diff==null?'Abgleich gespeichert':Math.abs(diff)<0.01?'Abgleich gespeichert – passt auf den Cent':`Abgleich gespeichert (Differenz ${sgn(diff)})`);S.checkDraft={};render()},
  bookDiff:el=>{const v=+el.dataset.v;if(v)diffForm(v,el.dataset.acc||'',el.dataset.cash==='1')},
  addInc:()=>{const box=$('#incList');box.insertAdjacentHTML('beforeend',incRow({name:'',a:''},box.children.length));box.lastElementChild.querySelector('input').focus()},
  addAcc:()=>{const box=$('#accList');box.insertAdjacentHTML('beforeend',accRow('',box.children.length,false));box.lastElementChild.querySelector('input').focus()},
  saveSettings:()=>{
    const list=(id,cur)=>$(id)?[...new Set($(id).value.split(',').map(s=>s.trim()).filter(Boolean))]:(cur||[]);
    const rows=$$('[data-accrow]').map(r=>({orig:r.querySelector('[data-acc-orig]').dataset.accOrig,name:r.querySelector('[data-acc-orig]').value.trim(),cash:r.querySelector('[data-acc-cash]').checked}));
    const used=a=>D.tx.some(t=>t.acc===a||t.acc2===a)||Object.values(D.subs).some(x=>x.acc===a);
    const gone=rows.filter(r=>r.orig&&!r.name&&used(r.orig));if(gone.length){toast(`„${gone[0].orig}“ hat noch Buchungen – zum Umbenennen einen neuen Namen eintippen statt das Feld zu leeren.`);return}
    const names=rows.map(r=>r.name).filter(Boolean);if(new Set(names).size!==names.length){toast('Zwei Konten heißen gleich – bitte eindeutige Namen.');return}
    const ren=rows.filter(r=>r.orig&&r.name&&r.orig!==r.name);
    mut(()=>{const mv=a=>{const r=ren.find(x=>x.orig===a);return r?r.name:a};
      if(ren.length){for(const t of D.tx){if(t.acc)t.acc=mv(t.acc);if(t.acc2)t.acc2=mv(t.acc2)}for(const x of Object.values(D.subs))if(x.acc)x.acc=mv(x.acc);
        for(const d of Object.values(D.debts)){if(d.acc)d.acc=mv(d.acc);if(d.settleAcc)d.settleAcc=mv(d.settleAcc)}
        for(const c of D.checks){const b={};for(const [a,v] of Object.entries(c.bal||{}))b[mv(a)]=v;c.bal=b}
        for(const w of Object.values(D.wealth)){const b={};for(const [a,v] of Object.entries(w.v||{}))b[mv(a)]=v;w.v=b}
        if(S.entry)S.entry.acc=mv(S.entry.acc);const la=lsGet('kb-acc');if(la)lsSet('kb-acc',mv(la))}
      const wac=list('#wac',D.settings.wealthAccounts).map(mv);
      Object.assign(D.settings,{accounts:names,cashAccounts:rows.filter(r=>r.name&&r.cash).map(r=>r.name),people:list('#ppl',D.settings.people),wealthAccounts:[...new Set(wac)]})},
      ren.length?`Gespeichert · ${ren.map(r=>`„${r.orig}“ → „${r.name}“`).join(', ')} in allen Buchungen umbenannt`:'Einstellungen gespeichert')},
  theme:el=>{mut(()=>{D.settings.theme=el.dataset.t},null)},
  backupWeb:()=>backupWeb().catch(e=>{console.error(e);toast('Sicherung fehlgeschlagen: '+e.message)}),restoreWeb:()=>restoreWeb(),
  incEntry:()=>{S.entry=null;entryState().k='einnahme';S.entryMode='hand';go('entry')},
  mode:el=>{const v=el.dataset.v==='1';if(v===simple())return;if(v){Object.assign(S.filt,{q:'',k:'alle',c:'',g:'',acc:'',range:'monat'});S.picked.clear();S.txView='list';S.entryMode='hand';if(!SIMPLE_NAV.includes(S.view)&&S.view!=='help')S.view='start'}
    mut(()=>{D.settings.simple=v},v?'Einfache Ansicht – alles andere ist nur ausgeblendet':'Erweiterte Ansicht')},
  dupDel:el=>{const t=D.tx.find(x=>x.id===el.dataset.id);if(t)mut(()=>removeTx(t.id),'Doppelbuchung gelöscht')},
  exportXlsx:()=>exportXlsx(),downloadJson:()=>downloadJson(),
  pickFolder:()=>{closeDrawer();pickFolder().catch(e=>{console.error(e);if(S.phase!=='ready'){S.loadErr=e.message;S.phase='pick';render()}else{toast('Ordner konnte nicht geöffnet werden: '+e.message);if(S.brokenDir)toast('Die Datei in diesem Ordner ist beschädigt – dein bisheriges Kassabuch bleibt offen.')}})},
  resume:()=>resumeFolder().catch(e=>{console.error(e);S.loadErr=e.message;S.phase='pick';render()}),
  createHere:()=>{const d=S.emptyDir;closeDrawer();if(d)openPicked(d,true).catch(e=>{console.error(e);toast('Anlegen fehlgeschlagen: '+e.message)})},
  takeOver:async()=>{await takeOver();const n=S.busyNext;S.phase='boot';render();if(n==='pick')ACT.pickFolder();else if(n==='resume')ACT.resume();else bootOpen().catch(e=>{console.error(e);S.loadErr=e.message;S.phase='pick';render()})},
  reopen:()=>location.reload(),
  restoreLatest:()=>restoreLatest().catch(e=>{console.error(e);toast('Wiederherstellen fehlgeschlagen: '+e.message)}),restoreForm:()=>restoreForm().catch(e=>{console.error(e);toast(e.message)}),
  startLocal:()=>startLocal(),retrySave:()=>{ST.dirty=true;saveNow()},
  dismissFirst:()=>{S.firstRun=false;render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;
  if(el.tagName==='TR'&&e.target.closest('a,button,input,select,label'))return;if(el.type!=='checkbox')e.preventDefault();f(el,e)});
$('#scrim').addEventListener('click',closeDrawer);
// a file dropped anywhere opens the import instead of replacing the app in the window
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();if(S.phase!=='ready')return;if(e.target.closest&&e.target.closest('#drop'))return;
  const f=e.dataTransfer.files[0];S.entryMode='datei';if(S.view!=='entry')go('entry');readImportFile(f)});
document.addEventListener('keydown',e=>{if(S.phase!=='ready')return;const tag=(e.target.tagName||'');const typing=/INPUT|TEXTAREA|SELECT/.test(tag)||e.target.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();ST.dirty=true;saveNow();return}
  if(e.key==='Escape'){if(S.drawer){e.preventDefault();closeDrawer()}else if(S.picked.size){S.picked.clear();render()}return}
  if(S.drawer)return;
  if((e.key==='Enter'||e.key===' ')&&!typing&&e.target.matches&&e.target.matches('[data-act][tabindex]')){e.preventDefault();e.target.click();return}
  // undo the last change unless the cursor is in a text field (there Ctrl+Z undoes the typing)
  const textEdit=(tag==='INPUT'&&!/checkbox|radio|button/.test(e.target.type||''))||tag==='TEXTAREA'||e.target.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!textEdit){e.preventDefault();undo();return}
  if(e.altKey&&!typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();ACT[e.key==='ArrowLeft'?'prevMonth':'nextMonth']();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();go('entry')}
  else if(e.key==='/'){e.preventDefault();if(S.view!=='tx'){S.view='tx';S.filt.range='alle'}render();setTimeout(()=>{const q=$('#q');if(q)q.focus()},40)}});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());

// ---------- boot ----------
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||S.phase!=='ready')return;const d=today();if(d!==lastDay){lastDay=d;runAbos();render()}});
function afterLoad(){S.loadErr=null;applyTheme();render();setTimeout(runAbos,300)}
// If the browser closed the app while reopening the remembered folder last time, skip it once and ask for the folder again.
// sample book (separate demo file): data comes with the page, nothing is read or saved
async function boot(){if(window.KB_DEMO){D=normalize(clone(window.KB_DEMO));derive();S.demo=true;ST.mode=null;ST.status='demo';ST.dirName='Beispiel (nicht gespeichert)';S.phase='ready';afterLoad();return}
  if(WEB){startLocal();return}
  if(!hasFS()){S.phase='nofs';render();return}
  if(lsGet('kb-boot')){lsSet('kb-boot','');S.bootGuard=true;S.phase='pick';render();return}
  try{localStorage.removeItem('kassabuch-mirror')}catch(e){}
  if(await otherWindowOpen()){busy('boot');return}
  await bootOpen()}
async function bootOpen(){lsSet('kb-boot',String(Date.now()));
  try{const dir=await kvGet('dir');if(!dir){S.phase='pick';render();return}
    S.resumeName=dir.name;let p='prompt';try{p=await dir.queryPermission({mode:'readwrite'})}catch(e){}
    if(p==='granted'){try{if(await openPicked(dir))return;return}catch(e){console.error(e);S.loadErr=e.message}}
    S.phase='resume';render()}
  finally{lsSet('kb-boot','')}}
render();boot().catch(e=>{console.error(e);S.loadErr=e.message;S.phase='pick';render()});

})();
</script>
