<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1D6A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kassabuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Kassabuch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D6A55'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='19' font-weight='800' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E">
<style>
/* Kassabuch – desktop ledger. Sidebar navigation, wide content area, tables for lists, a side panel for editing.
   Windows 11 system fonts; amounts use tabular figures so columns line up. */
:root{
  --paper:#F3F5F3; --side:#E9EEEA; --card:#FFFFFF; --ink:#16201B; --ink2:#44514A; --ink3:#5F6B65; --line:#D9E1DB; --line2:#E8EDE9; --hover:#F1F5F2;
  --accent:#1D6A55; --accent-h:#175846; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --amber:#9A620F; --amber-soft:#F7EBD3; --red:#B4372A; --red-soft:#F8E1DC; --indigo:#4851BE; --indigo-soft:#E4E6F8; --ok:#25734A; --ok-soft:#DDF0E3;
  --save:#2C7DA0; --c1:#1D6A55; --c2:#3F9A7C; --c3:#8CC6B0; --c4:#4851BE; --c5:#9097E3; --c6:#7A8780; --c7:#B5761A; --c8:#D29E45; --c9:#E7CD8E; --c10:#B9C3BD;
  --shadow:0 1px 2px rgba(22,32,27,.05),0 2px 8px rgba(22,32,27,.04); --shadow2:0 8px 40px rgba(10,20,15,.18);
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-disp:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --navact:#FFFFFF; --rest:#8CC6B0;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1424; --side:#0A1020; --card:#141D31; --ink:#E8ECF5; --ink2:#A9B4CA; --ink3:#8794AE; --line:#243049; --line2:#1A2439; --hover:#1B2640;
  --accent:#F2B45A; --accent-h:#F7C677; --accent-ink:#0D1424; --accent-soft:#2B2414;
  --amber:#F2B45A; --amber-soft:#2B2414; --red:#EF7B69; --red-soft:#3A1C22; --indigo:#8FA2FF; --indigo-soft:#1F2A55; --ok:#5ED0C0; --ok-soft:#12332F;
  --save:#7CC4F2; --c1:#5ED0C0; --c2:#3AA394; --c3:#24675F; --c4:#8FA2FF; --c5:#5F6FCC; --c6:#7F8AA3; --c7:#F08A6C; --c8:#C0684F; --c9:#7A4636; --c10:#3A4560;
  --navact:#1B2640; --rest:#B98A45;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow2:0 8px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1424; --side:#0A1020; --card:#141D31; --ink:#E8ECF5; --ink2:#A9B4CA; --ink3:#8794AE; --line:#243049; --line2:#1A2439; --hover:#1B2640;
  --accent:#F2B45A; --accent-h:#F7C677; --accent-ink:#0D1424; --accent-soft:#2B2414;
  --amber:#F2B45A; --amber-soft:#2B2414; --red:#EF7B69; --red-soft:#3A1C22; --indigo:#8FA2FF; --indigo-soft:#1F2A55; --ok:#5ED0C0; --ok-soft:#12332F;
  --save:#7CC4F2; --c1:#5ED0C0; --c2:#3AA394; --c3:#24675F; --c4:#8FA2FF; --c5:#5F6FCC; --c6:#7F8AA3; --c7:#F08A6C; --c8:#C0684F; --c9:#7A4636; --c10:#3A4560;
  --navact:#1B2640; --rest:#B98A45;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow2:0 8px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}
h2{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
h3{font-size:16px;font-weight:650}
p{margin:0}
kbd{font-family:inherit;font-size:11px;font-weight:600;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--card);color:var(--ink2);white-space:nowrap}
.muted{color:var(--ink3)}.small{font-size:12.5px}.ok{color:var(--ok)}.warn{color:var(--amber)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.amt.pos{color:var(--ok)}.amt.sav{color:var(--indigo)}
.r{text-align:right}.grow{flex:1}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-size:17px;padding:4px 10px 12px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.navh{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:12px 12px 4px}
.navsep{height:1px;background:var(--line);margin:10px 8px}
.nav{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 12px;border-radius:6px;text-align:left;color:var(--ink2);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav kbd{margin-left:auto;opacity:.7}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav[aria-current="page"]{background:var(--navact);color:var(--ink);font-weight:650;box-shadow:var(--shadow)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.sidefoot{margin-top:auto;padding:10px 12px 2px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.savestate{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);min-height:20px}
.savestate i{width:8px;height:8px;border-radius:9px;background:var(--line);flex:none}
.savestate.ok i{background:var(--ok)}.savestate.busy i{background:var(--amber)}.savestate.err i{background:var(--red)}.savestate.err{color:var(--red);font-weight:600}
.mainwrap{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line2);background:var(--paper);min-height:64px}
.topbar h1{font-family:var(--f-disp);font-size:22px;font-weight:650;letter-spacing:-.015em}
.content{flex:1;overflow:auto;padding:22px 28px 60px;display:flex;flex-direction:column;gap:18px;outline:none}
.content>*{max-width:1440px;width:100%}
.mswitch{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch button{border:0;background:none;min-width:30px;height:30px;border-radius:999px;font-size:17px;color:var(--ink2)}
.mswitch button:hover{background:var(--hover)}
.mswitch .today{font-size:12.5px;font-weight:600;padding:0 10px;color:var(--accent)}
.mswitch span{min-width:124px;text-align:center;font-weight:600}

/* ---------- basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:0;gap:0}
.pad{padding:14px 18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}.stack.sm{gap:8px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 340px}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.pri kbd{background:transparent;color:inherit;border-color:rgba(255,255,255,.45)}
.btn.danger{color:var(--red)}.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:4px 10px;font-size:12.5px}.btn.big{padding:10px 22px;font-size:15px}.btn.block{width:100%;justify-content:center;padding:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0}.link:hover{text-decoration:underline}
.ibtn{border:0;background:none;width:28px;height:28px;border-radius:6px;color:var(--ink3);flex:none}.ibtn:hover{background:var(--hover);color:var(--ink)}
.inp{width:100%;border:1px solid var(--line);border-bottom-color:var(--ink3);background:var(--card);border-radius:6px;padding:7px 10px;min-height:34px}
.inp:hover{background:var(--hover)}
.inp:focus{outline:none;border-color:var(--accent);border-bottom-width:2px;padding-bottom:6px;background:var(--card)}
select.inp{padding-right:28px}
/* inputs and dropdowns exactly the same height, so labels and fields line up */
input.inp:not([type=checkbox]),select.inp{height:36px;min-height:36px;line-height:20px}
textarea.inp{resize:vertical;min-height:120px}
.inp.hl{border-color:var(--amber);background:var(--amber-soft)}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl>span:first-child,.f>span:first-child{font-size:12px;font-weight:600;color:var(--ink2)}
.fl small,.chk small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.cbox{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;background:var(--card)}
.cbox input{accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px}.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;background:var(--line2);border-radius:7px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;font-weight:600;color:var(--ink2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg.big button{padding:7px 18px;font-size:14px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--amber-soft);color:var(--amber)}.chip.over{background:var(--red-soft);color:var(--red)}.chip.info{background:var(--indigo-soft);color:var(--indigo)}
.tag{display:inline-block;margin-left:7px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;vertical-align:1px;background:var(--line2);color:var(--ink2)}
.tag.e{background:var(--amber-soft);color:var(--amber)}.tag.s{background:var(--indigo-soft);color:var(--indigo)}.tag.a{background:var(--line2);color:var(--ink2)}.tag.i{background:var(--ok-soft);color:var(--ok)}.tag.g{background:var(--accent-soft);color:var(--accent)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:0}
.banner{background:var(--indigo-soft);border-radius:var(--r);padding:12px 16px;display:block;line-height:1.5}.banner>b:first-child{display:block;margin-bottom:4px}.banner>div+div,.banner>.btns{margin-top:8px}
.banner b{color:var(--indigo)}.banner.ok{background:var(--ok-soft)}.banner.ok b{color:var(--ok)}.banner.warn{background:var(--amber-soft)}.banner.warn b{color:var(--amber)}
.banner .link{display:inline}
.warnbox{background:var(--amber-soft);border-radius:6px;padding:10px 12px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:-4px}
.empty{padding:26px 18px;text-align:center;color:var(--ink3)}
.track{position:relative;height:8px;border-radius:99px;background:var(--line2)}
.track>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);max-width:100%}
.track>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.5}
.track.sm{height:6px}.track.warn>i{background:var(--amber)}.track.over>i{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}.legend i.ln{height:2px;background:var(--ink);vertical-align:3px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--ink3)}.chart text.strong{fill:var(--ink);font-weight:700}.chart line.grid{stroke:var(--line2)}
.chart rect[fill="transparent"]:hover{fill:var(--hover);fill-opacity:.5}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.kv{display:flex;flex-direction:column;gap:6px}.kv>div{display:flex;justify-content:space-between;gap:10px}.kv span{color:var(--ink2)}.kv b{font-weight:600;text-align:right}
.terms{margin:0;display:grid;grid-template-columns:200px 1fr;gap:10px 18px}.terms dt{font-weight:700}.terms dd{margin:0;color:var(--ink2)}

/* ---------- tables ---------- */
.tablewrap{overflow:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{position:sticky;top:0;background:var(--card);z-index:1;font-size:12px;font-weight:600;color:var(--ink3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.r{text-align:right}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t tr[data-act]{cursor:pointer}
table.t tbody tr[data-act]:hover td{background:var(--hover)}
table.t tr.picked td{background:var(--accent-soft)}
table.t tr.gh td{background:var(--paper);font-weight:650;font-size:13px;padding-top:10px}
table.t tr.tot td{font-weight:700;border-top:1px solid var(--line)}
table.t .th{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:600}.t .th:hover{color:var(--ink)}
table.t td.d{white-space:nowrap;color:var(--ink2);width:108px}
table.t td.w .tt{font-weight:600}
table.t .note{display:block;color:var(--ink3);font-size:12px;font-weight:400}
table.t .sub{display:block;color:var(--ink3);font-size:11.5px;font-weight:400}
table.t td.cb,table.t th.cb{width:36px;padding-right:0}
table.t td.cb input,table.t th.cb input{width:16px;height:16px;accent-color:var(--accent)}
table.t td.bar{min-width:160px}
.inp.cell{min-height:30px;padding:4px 8px;max-width:130px;margin-left:auto}input.inp.cell,select.inp.cell{height:30px;min-height:30px}
.inp.bud{width:84px;min-height:30px;padding:4px 8px}input.inp.bud{height:30px;min-height:30px}
.budin{display:inline-flex;gap:6px;align-items:center;color:var(--ink3)}
.filters{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px}
.filters .search{flex:1 1 300px;max-width:440px}
.filters select{width:auto;max-width:220px}
.sumline{display:flex;gap:22px;flex-wrap:wrap;color:var(--ink2);padding:0 4px}
.bulk{position:sticky;top:0;z-index:3;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:8px 12px}
.bulk select{width:auto}
.more{display:flex;justify-content:center;padding:12px}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-self:stretch}
.hero .lbl{font-size:13px;color:var(--ink2);font-weight:600}
.hero .big{font-family:var(--f-disp);font-size:40px;font-weight:650;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero .sub{color:var(--ink2)}
.hero .foot{font-size:12.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-self:stretch}
.kpis.row3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.row4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;font-weight:600;color:var(--ink3)}
.kpi .v{font-family:var(--f-disp);font-size:22px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--ink3)}
.week.due{border-color:var(--amber);background:linear-gradient(var(--amber-soft),var(--card) 70%)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.grp{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line2)}
.grp .hd,.fund .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grp .n{font-weight:600}
.mini{display:flex;flex-direction:column}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border:0;border-bottom:1px solid var(--line2);background:none;text-align:left;width:100%}
.mrow:last-child{border-bottom:0}
button.mrow:hover{background:var(--hover);margin:0 -8px;padding:7px 8px;width:calc(100% + 16px);border-radius:6px}
.mrow small{display:block;color:var(--ink3);font-size:12px}
.fund .big2{font-size:18px}
.plan{display:flex;flex-direction:column}.plan>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
.plan .tot{border-bottom:0;font-weight:700;padding-top:10px;align-items:center}.plan .totchip{border:0;padding:0;justify-content:flex-end}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-h{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}.bar-h .track{grid-column:1/-1}
.incrow{display:grid;grid-template-columns:1fr 140px auto;gap:8px;align-items:center}
.rulefm{display:grid;grid-template-columns:1fr;gap:8px}

/* ---------- drill-down & small additions ---------- */
.grp.click,.bar-h.click{cursor:pointer;border-radius:6px}
.grp.click:hover{background:var(--hover);margin:0 -8px;padding-left:8px;padding-right:8px}
.bar-h.click:hover{background:var(--hover);outline:6px solid var(--hover)}
.go{color:var(--ink3);font-weight:400;opacity:0;transition:opacity .12s}
.grp.click:hover .go,.bar-h.click:hover .go,tr:hover .go,tr:focus .go{opacity:1}

  const Ls=match(D.rules.learned||[]),Bs=match((D.rules.rules||[]).concat(baseRules()));if(Ls&&!(Bs&&Bs.w>Ls.w))return {c:Ls.c,src:'regel'};
  // last six bookings of this merchant; on a tie the most recent wins
  const hist={};let n=0;if(key)for(const t of TX){if(n>=6)break;if((t.k===k||(k==='erstattung'&&t.k==='ausgabe'))&&merchantKey(t.t)===key&&ok(t.c)){hist[t.c]=(hist[t.c]||0)+1;n++}}
  const h=Object.entries(hist).sort((a,b)=>b[1]-a[1])[0];if(h)return {c:h[0],src:'verlauf'};
  return Bs?{c:Bs.c,src:'grundregel'}:null}
const suggest=(desc,kind)=>suggestInfo(desc,kind)?.c||null;
const learnedFor=desc=>{const key=merchantKey(desc);return key?(D.rules.learned||[]).find(r=>r.p===key)||null:null};
function findDup(t,exceptId){return TX.find(x=>x.id!==exceptId&&x.k===t.k&&Math.abs(x.a-t.a)<0.005&&Math.abs(daysBetween(x.d,t.d))<=3&&((t.t&&merchantKey(x.t)&&merchantKey(x.t)===merchantKey(t.t))||(!t.t&&x.c===t.c)))}
function findDupes(){const out=[];const by={};for(const t of TX){if(t.k!=='ausgabe')continue;const k=Math.round(t.a*100);(by[k]=by[k]||[]).push(t)}
  for(const k in by){const g=by[k].slice().sort((a,b)=>a.d.localeCompare(b.d));for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const a=g[i],b=g[j];if(daysBetween(b.d,a.d)>3)break;
    if(!merchantKey(a.t)||merchantKey(a.t)!==merchantKey(b.t))continue;const abo=a.src==='abo'||b.src==='abo';if((a.src||'')===(b.src||''))continue;
    out.push(b.src==='abo'?[a,b]:a.src==='abo'?[b,a]:[a,b])}}return out}

// ---------- storage ----------

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('kassabuch',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

// find the data file in the picked folder: the folder itself, or its "Daten" subfolder

// opens a picked folder; an empty one asks first

  else{S.phase='empty';render()}}

// ---------- one window at a time ----------
// A second window would write over the first one's changes, so only one may edit. The other one can take over.
const WIN={id:uid('w'),bc:null};
try{WIN.bc=typeof BroadcastChannel==='function'?new BroadcastChannel('kassabuch'):null}catch(e){WIN.bc=null}
function otherWindowOpen(){return new Promise(res=>{if(!WIN.bc)return res(false);let done=false;const fin=v=>{if(done)return;done=true;WIN.bc.removeEventListener('message',h);res(v)};
  const h=e=>{const m=e.data||{};if(m.t==='here'&&m.to===WIN.id)fin(true)};WIN.bc.addEventListener('message',h);WIN.bc.postMessage({t:'who',from:WIN.id});setTimeout(()=>fin(false),350)})}
function busy(next){S.busyNext=next;S.phase='busy';render()}
function takeOver(){return new Promise(res=>{if(!WIN.bc)return res();let done=false;const fin=()=>{if(done)return;done=true;WIN.bc.removeEventListener('message',h);res()};
  const h=e=>{const m=e.data||{};if(m.t==='released'&&m.to===WIN.id)fin()};WIN.bc.addEventListener('message',h);WIN.bc.postMessage({t:'takeover',from:WIN.id});setTimeout(fin,4000)})}
if(WIN.bc)WIN.bc.addEventListener('message',async e=>{const m=e.data||{};if(m.from===WIN.id)return;
  if(m.t==='who'&&S.phase==='ready')WIN.bc.postMessage({t:'here',to:m.from,from:WIN.id});
  if(m.t==='takeover'&&S.phase==='ready'){try{await flushSave()}catch(err){console.warn(err)}clearTimeout(ST.timer);ST.mode=null;S.phase='taken';render();WIN.bc.postMessage({t:'released',to:m.from,from:WIN.id})}});

// what the file looked like at the last load or save – needed to merge when the file was changed elsewhere
const BASE={tx:new Map(),subs:new Map()};
function setBase(d){d=d||D;if(!d)return;BASE.tx=new Map((d.tx||[]).map(t=>[t.id,JSON.stringify(t)]));BASE.subs=new Map(Object.entries(d.subs||{}).map(([k,v])=>[k,JSON.stringify(v)]))}
// file version + changes made in this window: bookings and fixed payments one by one (changed here wins, deleted here stays deleted, new on either side is kept)
function mergeWith(F){const o=clone(D);const loc=new Map(D.tx.map(t=>[t.id,t]));const out=[];
  for(const f of F.tx){if(loc.has(f.id)){const l=loc.get(f.id);out.push(BASE.tx.get(f.id)!==JSON.stringify(l)?l:f);loc.delete(f.id)}else if(!BASE.tx.has(f.id))out.push(f)}
  for(const l of loc.values())if(!BASE.tx.has(l.id)||BASE.tx.get(l.id)!==JSON.stringify(l))out.push(l);o.tx=out;
  const subs={};for(const [k,f] of Object.entries(F.subs||{})){const l=D.subs[k];if(l)subs[k]=BASE.subs.get(k)!==JSON.stringify(l)?l:f;else if(!BASE.subs.has(k))subs[k]=f}
  for(const [k,l] of Object.entries(D.subs))if(!(k in subs)&&!(F.subs||{})[k]&&(!BASE.subs.has(k)||BASE.subs.get(k)!==JSON.stringify(l)))subs[k]=l;o.subs=subs;return o}
async function mergeFromFile(){const f=await ST.fh.getFile();const F=normalize(JSON.parse(await f.text()));const before=D.tx.length;D=mergeWith(F);ST.lastMod=f.lastModified;ST.conflict=false;UNDO.length=0;derive();closeDrawer();render();ST.dirty=true;await saveNow();toast(`Zusammengeführt – ${D.tx.length} Buchungen (${D.tx.length-before>=0?'+':''}${D.tx.length-before} aus der Datei)`)}

function startLocal(){if(WEB&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});const raw=lsGet('kassabuch-local');D=raw?normalize(JSON.parse(raw)):Object.assign(defaults(),{});if(!raw)D.settings.simple=true;derive();ST.mode='local';ST.status='ok';S.phase='ready';afterLoad()}

function dirty(){if(S.demo){ST.status='demo';paintSave();return}ST.dirty=true;ST.status='pending';clearTimeout(ST.timer);ST.timer=setTimeout(()=>saveNow(),600);paintSave()}
async function saveNow(force){clearTimeout(ST.timer);if(!D||!ST.mode)return;if(ST.saving){ST.again=true;return}
  if(!ST.dirty&&!force)return;ST.saving=true;ST.status='saving';paintSave();
  D.savedAt=new Date().toISOString();const json=JSON.stringify(D);
  try{
    if(ST.mode==='file'){const fh=ST.fh,dir=ST.dir;
      const cur=await fh.getFile();
      if(ST.lastMod&&cur.lastModified!==ST.lastMod&&!force){ST.conflict=true;throw Object.assign(new Error('conflict'),{code:'conflict'})}
      await dailyBackup(cur,dir);
      const w=await fh.createWritable();await w.write(json);await w.close();
      if(fh===ST.fh){ST.lastMod=(await fh.getFile()).lastModified;setBase(JSON.parse(json))}}
    else if(!lsSet('kassabuch-local',json))throw new Error('Browser-Speicher voll');
    ST.dirty=false;ST.status='ok';ST.savedAt=new Date();ST.err=null;ST.conflict=false}
  catch(e){console.error(e);ST.status=e.code==='conflict'?'conflict':'error';ST.err=e}
  finally{ST.saving=false;paintSave();if(ST.status==='conflict')conflictPanel();if(ST.again){ST.again=false;if(ST.dirty)saveNow()}}}
async function dailyBackup(cur,dir){const day=today();if(ST.backupDay===day||!cur.size)return;
  try{const bdir=await dir.getDirectoryHandle('Backups',{create:true});const name=`kassabuch-${day}.json`;
    let exists=true;try{await bdir.getFileHandle(name)}catch(e){exists=false}
    if(!exists){const fh=await bdir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(await cur.text());await w.close()}
    const names=[];for await(const [n,h] of bdir.entries()){if(h.kind==='file'&&/^kassabuch-\d{4}-\d{2}-\d{2}\.json$/.test(n))names.push(n)}
    names.sort().reverse().slice(40).forEach(n=>bdir.removeEntry(n).catch(()=>{}));ST.backupDay=day}catch(e){console.warn('backup',e)}}
async function flushSave(){for(let i=0;i<40&&ST.saving;i++)await new Promise(r=>setTimeout(r,50));if(ST.dirty)await saveNow()}
async function reloadFromFile(){const f=await ST.fh.getFile();D=normalize(JSON.parse(await f.text()));ST.lastMod=f.lastModified;ST.dirty=false;ST.status='ok';ST.conflict=false;UNDO.length=0;derive();setBase();closeDrawer();render();toast('Neu geladen')}
function paintSave(){const el=$('#savestate');if(!el)return;const t=ST.savedAt?`${pad(ST.savedAt.getHours())}:${pad(ST.savedAt.getMinutes())}`:'';
  const m={ok:['ok',ST.mode==='local'?`${WEB?'Auf diesem Gerät':'Im Browser'} gespeichert ${t}`:`Gespeichert ${t}`],pending:['busy','Änderungen …'],saving:['busy','Speichert …'],error:['err','Speichern fehlgeschlagen'],conflict:['err','Datei woanders geändert'],demo:['busy','Beispiel – nichts wird gespeichert']}[ST.status]||['', ''];
  el.className='savestate '+m[0];el.innerHTML=`<i></i><span>${m[1]}</span>${ST.status==='error'?'<button type="button" class="link" data-act="retrySave">Nochmal</button>':''}`}
window.addEventListener('beforeunload',e=>{if(ST.dirty||ST.saving){saveNow();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&ST.dirty)saveNow()});

// ---------- changes & undo ----------
const UNDO=[];
function mut(fn,msg,opt){const snap=JSON.stringify(D);let r;
  try{r=fn()}catch(e){console.error(e);D=JSON.parse(snap);derive();render();toast('Das hat nicht geklappt – nichts wurde geändert. ('+(e&&e.message||e)+')');return null}
  if(!(opt&&opt.noUndo)){UNDO.push(snap);if(UNDO.length>40)UNDO.shift()}const tok=UNDO.length;
  derive();dirty();if(!(opt&&opt.noRender))render();if(msg)toast(msg,opt&&opt.noUndo?null:tok);return r}
function undo(tok){if(tok&&UNDO.length!==tok){toast('Das geht nicht mehr – inzwischen wurde etwas anderes geändert.');return}
  const s=UNDO.pop();if(!s){toast('Nichts zum Rückgängigmachen');return}D=JSON.parse(s);derive();dirty();closeDrawer();render();toast('Rückgängig gemacht')}
const TXF=['d','bd','a','k','c','t','acc','acc2','typ','note','share','fund','src','sub','ts','ext','kept'];
function cleanTx(t){const o={};for(const f of TXF)if(t[f]!==undefined&&t[f]!==null&&t[f]!=='')o[f]=t[f];o.a=r2(o.a);o.id=t.id||uid();return o}
function upsertTx(t){const o=cleanTx(t);const i=D.tx.findIndex(x=>x.id===o.id);if(i>=0)D.tx[i]=o;else{o.ts=o.ts||Date.now();D.tx.push(o)}syncDebt(o);return o}
function removeTx(id){D.tx=D.tx.filter(x=>x.id!==id);for(const [k,d] of Object.entries(D.debts))if(d.txId===id&&!d.done)delete D.debts[k]}
function syncDebt(t){const ex=Object.entries(D.debts).find(([,d])=>d.txId===t.id);
  if(t.k==='ausgabe'&&t.share&&t.share.a>0){const data={p:t.share.p,a:r2(t.share.a),note:t.t||catName(t.c),d:t.d,txId:t.id,done:ex?!!ex[1].done:false};if(ex){data.doneAt=ex[1].doneAt;data.settleAcc=ex[1].settleAcc}D.debts[ex?ex[0]:uid('d')]=data}
  else if(ex&&!ex[1].done)delete D.debts[ex[0]]}
function learn(desc,c){const key=merchantKey(desc);if(!key||key.length<3)return;D.rules.learned=(D.rules.learned||[]).filter(x=>x.p!==key);D.rules.learned.push({p:key,c,t:String(desc).trim().slice(0,60)});D.rules.learned=D.rules.learned.slice(-900)}

// ---------- abos ----------
// due subscriptions are booked on start; a payment already typed in (same amount, ±3 days) is not booked twice
function runAbos(){const T=today();let n=0;const changes=[];
  for(const [sid,s] of Object.entries(D.subs)){if(s.status==='kuendigen'||!s.next||!(+s.a>0))continue;const kind=subKind(s);const manual=s.auto===false;let next=s.next,guard=0;
    while(next<=T&&guard<36){guard++;const id=`abo-${sid}-${next}`;const exists=D.tx.some(x=>x.id===id);
      const dup=!exists&&TX.find(x=>x.src!=='abo'&&x.k===kind&&Math.abs(x.a-(+s.a))<0.01&&Math.abs(daysBetween(x.d,next))<=(manual?6:3)&&paidAs(x,s));
      // entered by hand: once it is in the book the reminder moves on to the next date, otherwise it waits
      if(manual){if(exists||dup){next=subStep(s,next);continue}break}
      const fx=kind==='ausgabe'&&!isMonthlyish(s)?fixFundId():null;
      if(!exists&&!dup){changes.push({id,d:next,a:+s.a,k:kind,c:s.c,t:s.name,acc:s.acc||null,src:'abo',sub:sid,ts:Date.now(),...(fx?{typ:'einmalig',fund:fx}:{})});n++}
      else if(dup&&fx&&!dup.fund)changes.push({link:dup.id,fund:fx});
      next=subStep(s,next)}
    if(next!==s.next)changes.push({sid,next})}
  if(!changes.length)return;
  mut(()=>{for(const c of changes){if(c.sid)D.subs[c.sid].next=c.next;else if(c.link){const t=D.tx.find(x=>x.id===c.link);if(t){t.fund=c.fund;t.typ='einmalig'}}else D.tx.push(cleanTx(c))}},n?(n===1?'1 regelmäßige Zahlung automatisch gebucht':`${n} regelmäßige Zahlungen automatisch gebucht`):null)}
// book a due payment that is set to 'enter myself' (one click from the reminder)
function bookDue(sid,skip){const s=D.subs[sid];if(!s||!s.next)return;const kind=subKind(s);const d=s.next;
  mut(()=>{if(!skip)D.tx.push(cleanTx({id:`abo-${sid}-${d}`,d,a:+s.a,k:kind,c:s.c,t:s.name,acc:s.acc||null,src:'abo',sub:sid,ts:Date.now()}));D.subs[sid].next=subStep(s,d)},
    skip?`„${s.name}“ übersprungen – nächstes Mal ${fmtDate(subStep(s,d))}`:`Eingetragen: ${s.name} ${kind==='einnahme'?'+':''}${eur(+s.a)} · Betrag anders? In Buchungen anklicken`)}

// ---------- start over from a date: bookings before it go, the set-up stays ----------
// what the old bookings taught: per merchant the category used most in its last six bookings (kept as learned merchants)
function rulesFromHistory(before){const hist=new Map();for(const t of TX){if(t.d>=before||!t.t||t.src==='abo'||!['ausgabe','erstattung','einnahme'].includes(t.k))continue;const k=merchantKey(t.t);if(!k||k.length<3)continue;
    const e=hist.get(k)||{n:0,c:{},t:t.t.trim()};if(e.n<6){e.c[t.c]=(e.c[t.c]||0)+1;e.n++}hist.set(k,e)}
  const have=new Set((D.rules.learned||[]).map(r=>r.p));return [...hist].filter(([k])=>!have.has(k)).map(([k,e])=>({p:k,c:Object.entries(e.c).sort((a,b)=>b[1]-a[1])[0][0],t:e.t.slice(0,60)})).filter(r=>r.c&&cat(r.c))}
async function startOver(from,keep){const old=JSON.stringify(D);const until=addDays(from,-1);const learnedNew=rulesFromHistory(from);
  if(ST.mode==='file'&&keep){try{const b=await ST.dir.getDirectoryHandle('Backups',{create:true});const fh=await b.getFileHandle(`kassabuch-archiv-bis-${until}.json`,{create:true});const w=await fh.createWritable();await w.write(old);await w.close()}
    catch(e){console.error(e);toast('Die Kopie der alten Daten konnte nicht angelegt werden – es wurde nichts gelöscht.');return false}}
  const n=D.tx.filter(t=>t.d<from).length;
  mut(()=>{D.tx=D.tx.filter(t=>t.d>=from);D.checks=[];D.wealth={};D.reviews=Object.fromEntries(Object.entries(D.reviews||{}).filter(([k])=>k>=from.slice(0,7)));
    for(const [id,x] of Object.entries(D.debts))if((x.d||'')<from)delete D.debts[id];
    for(const f of Object.values(D.funds)){f.start=0;if(!f.since||f.since<from)f.since=from}
    for(const s of Object.values(D.subs))if(s.next&&s.next<from)s.next=from;
    D.rules.learned=(D.rules.learned||[]).concat(learnedNew).slice(-900);D.meta=Object.assign({},D.meta,{importedThrough:{},freshStart:from,startListDone:false})},
    `Neu angefangen ab ${fmtDate(from)} · ${n} alte Buchungen ${keep?'gelöscht (Kopie im Ordner „Backups“)':'gelöscht'} · ${learnedNew.length} Händler gemerkt`);
  Object.assign(S,{session:[],picked:new Set(),sel:{y:now().getFullYear(),m:now().getMonth()+1}});Object.assign(S.filt,{q:'',k:'alle',c:'',g:'',acc:'',range:'monat'});go('start');
  await flushSave();
  return true}

let toastT;function toast(msg,undoTok){const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>${undoTok?'<button type="button" id="undoBtn">Rückgängig <kbd>Strg+Z</kbd></button>':''}`;el.hidden=false;clearTimeout(toastT);
  if(undoTok)$('#undoBtn').onclick=()=>{el.hidden=true;undo(undoTok)};toastT=setTimeout(()=>el.hidden=true,undoTok?7000:3500)}

  if(t.k==='ausgabe'&&typeOf(t)==='einmalig')out.push('<span class="tag e">unregelmäßig</span>');if(t.src==='abo')out.push('<span class="tag a" title="Automatisch gebucht von einer fixen Zahlung">fix</span>');if(t.share)out.push(`<span class="tag g">geteilt · ${esc(t.share.p)}</span>`);return out.join('')}

function txTable(list,opt={}){const sm=simple();const sel=opt.select&&!sm;const sortable=opt.sort;const sh=(col,l,cls='')=>sortable?`<th class="${cls}"><button type="button" class="th" data-act="sort" data-col="${col}">${l}${S.sort.col===col?(S.sort.dir<0?' ↓':' ↑'):''}</button></th>`:`<th class="${cls}">${l}</th>`;

function kpi(l,v,s,style=''){return `<div class="kpi"><div class="l">${l}</div><div class="v" style="${style}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}

function hhCard(s,pa,y,m){const inc=s.inc,fix=s.hFix,vr=s.hVar,ein=s.hEin,aus=r2(fix+vr+ein),sp=r2(s.spar),rest=r2(inc-aus-sp);const plan=incomeFor(y,m);const cur=isCur(),past=mkey(y,m)<today().slice(0,7);
  const out=aus+Math.max(0,sp);const W=Math.max(inc,out,1);const planSp=activePlans().reduce((a,[,x])=>a+subMonthly(x),0);const seg=(k,v,lbl)=>v>=0.5?`<i style="width:${(v/W*100).toFixed(2)}%;background:${KCOL[k]}" title="${lbl} ${eur(v,0)}"></i>`:'';
  const fixTop=Object.entries(stats(monthTx(y,m).filter(t=>klass(t)==='fix')).cat).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c])=>catName(c));
  const chk=activeSubs().filter(([,x])=>x.status==='pruefen').length;
  const cell=(k,label,v,sub,cls='')=>`<button type="button" class="hhc ${cls}" data-act="hhShow" data-k="${k}" title="Buchungen anzeigen"><span class="l"><i style="background:${KCOL[k]||'transparent'}"></i>${label}</span><b>${v}</b><small>${/^-/.test(v)&&k!=='inc'?(k==='spar'?'mehr entnommen als gespart':'mehr erstattet als ausgegeben'):sub}</small></button>`;
  const over=out>inc;const gap=r2(plan-inc);
  // income against the plan: still to come in the running month, more or less than planned once the month is over
  const incSub=!plan?'':cur||!past?(gap>=0.5?`von ${eur(plan,0)} geplant · ${eur(gap,0)} kommen noch`:gap<=-0.5?`${eur(-gap,0)} mehr als geplant`:'wie geplant'):(gap>=0.5?`${eur(gap,0)} weniger als geplant`:gap<=-0.5?`${eur(-gap,0)} mehr als geplant`:'wie geplant');
  const restSub=inc<0.5?'noch keine Einnahmen':rest>=0?`${pct(rest/inc)} der Einnahmen`:-rest<=inc?`${pct(-rest/inc)} mehr als eingenommen`:'mehr ausgegeben als eingenommen';
  // the running month: what is still expected until the end of it
  const due=cur?dueRest():null;const exp=cur?Math.max(0,gap):0;const endV=cur?r2(rest+exp-due.all):0;
  const fc=cur&&(exp>=0.5||due.all>=0.5)?`<span class="fc">Bis Monatsende${exp>=0.5?` + ${eur(exp,0)} erwartete Einnahmen`:''}${due.all>=0.5?` − ${eur(due.all,0)} noch fällig`:''} = <b class="${endV<0?'neg':''}">${eur(endV,0)}</b> für Alltag & Extras</span>`:'';
  return `<div class="sec-h"><h2>Haushaltsrechnung ${MONTHS[m-1]}</h2><span class="small muted">${cur?'bisher in diesem Monat · ':''}<button type="button" class="link" data-act="goFlow">Als Finanzfluss ansehen →</button></span></div>
   <div class="hhrow">${cell('inc','Einnahmen',eur(inc,0),incSub)}
    <span class="op" aria-hidden="true">−</span>${cell('fix','Fixkosten',eur(fix,0),chk?`${chk} ${chk===1?'Abo':'Abos'} zum Prüfen`:(fixTop.join(', ')||'Miete, Strom, Abos …'))}
    <span class="op" aria-hidden="true">−</span>${cell('var','Alltag',eur(vr,0),pa?`sonst ${eur(pa.hVar,0)}${pa.day?` bis zum ${pa.day}.`:''}`:'Lebensmittel, Essen gehen …')}
    <span class="op" aria-hidden="true">−</span>${cell('einm','Unregelmäßig',eur(ein,0),(n=>n?`${n} ${n===1?'Ausgabe':'Ausgaben'}`:'Urlaub, Technik …')(monthTx(y,m).filter(t=>klass(t)==='einm'&&t.k==='ausgabe').length))}
    <span class="op" aria-hidden="true">−</span>${cell('spar','Investiert',eur(sp,0),planSp?`Sparplan ${eur(planSp,0)}/Monat`:'ETF, Sparen …')}
    <span class="op" aria-hidden="true">=</span><div class="hhc rest ${rest<0?'neg':''}"><span class="l">Übrig</span><b>${eur(rest,0)}</b><small>${restSub}</small></div></div>
   <div class="flow" role="img" aria-label="Einnahmen ${eur(inc,0)}: Fixkosten ${eur(fix,0)}, Alltag ${eur(vr,0)}, unregelmäßig ${eur(ein,0)}, investiert ${eur(sp,0)}, übrig ${eur(rest,0)}">${seg('fix',fix,'Fixkosten')}${seg('var',vr,'Alltag')}${seg('einm',ein,'Unregelmäßig')}${seg('spar',sp,'Gespart & investiert')}${rest>=0.5?`<i class="restseg" style="width:${(rest/W*100).toFixed(2)}%" title="Übrig ${eur(rest,0)}"></i>`:''}${over&&inc>0?`<b class="incmark" style="left:${(inc/W*100).toFixed(2)}%" title="Einnahmen ${eur(inc,0)}"></b>`:''}</div>
   <div class="hhfoot"><span>Ausgaben gesamt <b>${eur(aus,0)}</b><span class="muted"> · ${aus<-0.004?'mehr Erstattungen als Ausgaben':'Fixkosten, Alltag und Unregelmäßiges'}</span></span>${fc}</div>
   ${over&&inc>0?`<p class="small muted flownote">Der Strich im Balken zeigt deine Einnahmen – rechts davon: ${eur(out-inc,0)} mehr ausgegeben oder angelegt als eingenommen.</p>`:inc<0.5&&aus>=0.5?'<p class="small muted flownote">In diesem Monat sind noch keine Einnahmen eingetragen.</p>':''}`}
function startList(){const m=D.meta||{};if(!m.freshStart||m.startListDone)return '';const fix=activeSubs(),inc=activeIncome(),pl=activePlans();
  const item=(ok,t,txt,btn)=>`<li class="${ok?'done':''}"><span class="ck" aria-hidden="true">${ok?'✓':''}</span><div><b>${t}</b><small>${txt}</small></div>${btn}</li>`;

    ${item(pl.length>0,'Sparplan',pl.length?pl.map(([,x])=>`${esc(x.name)} ${eur(+x.a,0)}`).join(', '):'Was du jeden Monat investierst – zählt unter „Gespart & investiert“, nicht als Ausgabe.',pl.length?'':'<button type="button" class="btn sm" data-act="subPreset" data-n="Sparplan (ETF)" data-c="'+presetCat(['etf','ruecklage'],'sparen')+'" data-e="1" data-k="sparen">+ Sparplan</button>')}
    ${!budOn()?'':item(varBudget()>0,'Budget festgelegt?',`${eur(budgetL(),0)} pro Monat für Fixkosten und Alltag.`,'<button type="button" class="btn sm" data-act="nav" data-view="budget">Budget</button>')}
    ${item(false,'Jede Woche eintragen','Alles aus der Banking-App ab dem '+fmtDate(m.freshStart)+'. Bar-Käufe mit Konto „Bargeld“, Abhebungen nicht.','<button type="button" class="btn sm pri" data-act="nav" data-view="entry">Eintragen</button>')}
   </ol></section>`}

// overview: everyday spending ('Alltag') this month, the areas against the usual, what is still due
function vStart(){if(simple())return vStartSimple();const {y,m}=S.sel;const list=monthTx(y,m);const s=stats(list);const cur=isCur();const past=isPast();
  const pace=cur?(now().getDate()-.5)/dim(y,m):null;const daysLeft=cur?dim(y,m)-now().getDate()+1:0;const pa=prevAvg(y,m);
  // the hero is about everyday spending only – fixed costs are planned anyway, the household card above shows everything
  const A=budOn()?varBudget():0,vs=s.hVar,rest=r2(A-vs);const chart=cWeeks();const nd=cur?now().getDate():past?dim(y,m):0;
  const cmp=pa?(()=>{const d=vs-pa.hVar;return Math.abs(d)<1?`etwa so viel wie sonst${pa.day?` bis zum ${pa.day}.`:''} (${eur(pa.hVar,0)})`:`<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'} ${eur(Math.abs(d),0)} ${d>0?'mehr':'weniger'}</span> als sonst${pa.day?` bis zum ${pa.day}.`:''} (${eur(pa.hVar,0)})`})():'';
  let hero;
  if(!A)hero=`<div class="lbl">Alltag im ${MONTHS[m-1]}${cur?' · bisher':''}</div><div class="big">${eur(vs,0)}</div><div class="sub">${[cmp,nd&&vs>=0.5?`Ø ${eur(vs/nd,0)} pro Tag`:''].filter(Boolean).join(' · ')||'Lebensmittel, Essen gehen, Freizeit … – ohne Fixkosten und Unregelmäßiges'}</div>`;
  else if(cur)hero=`<div class="lbl">Noch frei für den Alltag</div><div class="big" style="color:${rest<0?'var(--red)':'var(--ink)'}">${eur(rest,0)}</div>${track(vs,A,pace)}
    <div class="sub">${rest>0?`≈ <b>${eur(rest/daysLeft,0)}</b> pro Tag für ${daysLeft} ${daysLeft===1?'Tag':'Tage'}`:`<b style="color:var(--red)">${eur(-rest,0)} über dem Alltagsbudget</b>`} · ${eur(vs,0)} von ${eur(A,0)} ausgegeben</div>`;
  else hero=`<div class="lbl">Alltag im ${MONTHS[m-1]} ${y}</div><div class="big">${eur(vs,0)} <span class="muted" style="font-size:20px">/ ${eur(A,0)}</span></div>${track(vs,A,null)}<div class="sub">${past?(rest>=0?`${eur(rest,0)} unter dem Alltagsbudget`:`<b style="color:var(--red)">${eur(-rest,0)} über dem Alltagsbudget</b>`):'Alltagsbudget für diesen Monat'}</div>`;
  hero+=`<div class="hchart"><div class="chartwrap" id="chartwrap">${chart.svg}<div class="ctip" id="ctip" hidden></div></div>${chart.legend}</div>`;
  // areas compared with the usual (same days of the three months before); one status per area, over budget first
  const grs=groupsL().map(g=>{const sp=s.grpL[g]||0,bu=grpBudget(g,s);return {g,sp,bu,av:pa?(pa.grpL[g]||0):null,ov:bu?sp-bu:0}}).filter(x=>x.sp>=0.5||x.bu||x.av>=0.5).sort((a,b)=>(b.ov>=0.5)-(a.ov>=0.5)||(b.ov>=0.5?b.ov-a.ov:0)||b.sp-a.sp||b.av-a.av);const gmax=Math.max(1,...grs.map(x=>x.sp));
  const groups=grs.map(({g,sp,bu,av,ov})=>{const st=status(s.grpV[g]||0,grpVarBudget(g),pace);const d=av!=null?sp-av:null;const vg=varGroups().includes(g);
    const usual=av==null?'':Math.abs(d)<1?`wie sonst (${eur(av,0)})`:`<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'} ${eur(Math.abs(d),0)}</span> ${d>0?'mehr':'weniger'} als sonst`;

// ---------- view: Buchungen ----------
function filteredTx(){const {y,m}=S.sel;const f=S.filt;let list=TX;
  if(f.range==='monat')list=list.filter(t=>inM(t,y,m));else if(f.range==='jahr')list=list.filter(t=>inY(t,y));else if(f.range==='span')list=list.filter(t=>t.d>=f.from&&t.d<=f.to);
  if(f.q){const q=norm(f.q);const qa=parseAmt(f.q);list=list.filter(t=>norm(t.t).includes(q)||norm(catName(t.c)).includes(q)||norm(t.note).includes(q)||norm(t.acc).includes(q)||norm(t.acc2).includes(q)||(isFinite(qa)&&Math.abs(t.a-qa)<0.005))}
  if(f.k==='aus')list=list.filter(t=>t.k==='ausgabe');else if(f.k==='ein')list=list.filter(t=>t.k==='einnahme'||t.k==='erstattung');else if(f.k==='einm')list=list.filter(t=>klass(t)==='einm');else if(f.k==='fix')list=list.filter(t=>klass(t)==='fix');else if(f.k==='var')list=list.filter(t=>klass(t)==='var');else if(f.k==='geteilt')list=list.filter(t=>t.share);else if(f.k==='sparen')list=list.filter(t=>t.k==='sparen'||t.k==='entnahme');else if(f.k==='abo')list=list.filter(t=>t.src==='abo');else if(f.k==='umb')list=list.filter(t=>t.k==='umbuchung');
  if(f.c)list=list.filter(t=>t.c===f.c);if(f.g)list=list.filter(t=>(cat(t.c)?.group||'')===f.g);if(f.acc)list=list.filter(t=>(t.acc||'')===f.acc||t.acc2===f.acc);
  const {col,dir}=S.sort;const key={d:t=>t.d,t:t=>norm(t.t||catName(t.c)),c:t=>norm(catName(t.c)),a:t=>t.k==='ausgabe'?net(t):t.a}[col];
  if(col!=='d'||dir!==-1)list=list.slice().sort((a,b)=>{const x=key(a),z=key(b);return (x<z?-1:x>z?1:0)*dir||b.d.localeCompare(a.d)});return list}
// the month as a calendar: what went out on which day, fixed payments marked, payments still to come dashed
function calGrid(list){const {y,m}=S.sel;const first=`${mkey(y,m)}-01`,end=monthEnd(y,m),T=today();const by={};for(const t of list)(by[t.d]=by[t.d]||[]).push(t);
  const due={};if(end>=T)for(const x of Object.values(D.subs)){if(x.status==='kuendigen'||!x.next||!(+x.a>0))continue;let d=x.next,g=0;while(d<=end&&g<60){g++;if(d>=first&&d>T)(due[d]=due[d]||[]).push(x);d=subStep(x,d)}}
  const dow=(new Date(y,m-1,1).getDay()+6)%7,n=+end.slice(8);let h='';for(let i=0;i<dow;i++)h+='<div class="cday out"></div>';
  for(let i=1;i<=n;i++){const d=`${mkey(y,m)}-${pad(i)}`;const l=by[d]||[];const s=stats(l);const lines=[];
    if(s.inc>=0.005)lines.push(`<span class="cchip inc">+${eur(s.inc,0)}</span>`);
    for(const t of l)if(t.sub&&(t.k==='ausgabe'||t.k==='sparen'))lines.push(`<span class="cchip ${t.k==='sparen'?'sav':'fix'}">${esc(t.t||catName(t.c))}</span>`);
    const mer=[...new Set(l.filter(t=>!t.sub&&(t.k==='ausgabe'||t.k==='erstattung')).map(t=>t.t||catName(t.c)))];if(mer.length)lines.push(`<span class="mer">${esc(mer.join(', '))}</span>`);
    for(const x of due[d]||[])lines.push(`<span class="cchip due" title="kommt noch">${esc(x.name)} ${eur(x.a,0)}</span>`);
    const more=lines.length>3?`<span class="mer">+ ${lines.length-3} weitere</span>`:'';
    h+=`<button type="button" class="cday ${d===T?'today':d>T?'fut':''}" data-act="calDay" data-d="${d}" ${l.length?'':'data-empty="1"'} title="${l.length?`${l.length} ${l.length===1?'Buchung':'Buchungen'} am ${fmtDate(d)} anzeigen`:`Am ${fmtDate(d)} eintragen`}"><span class="top"><span class="dn">${i}.</span>${Math.abs(s.aus)>=0.005?`<b>${eur(s.aus,0)}</b>`:''}</span>${lines.slice(0,3).join('')}${more}</button>`}
  const tail=(7-(dow+n)%7)%7;for(let i=0;i<tail;i++)h+='<div class="cday out"></div>';
  return `<section class="card flush"><div class="calhead">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal">${h}</div>
   <p class="small muted pad">Die Zahl ist, was an dem Tag ausgegeben wurde. <span class="cchip fix" style="display:inline">fixe Zahlung</span> <span class="cchip due" style="display:inline">kommt noch</span> · Tag anklicken zeigt die Buchungen, ein leerer Tag öffnet „Eintragen“ mit diesem Datum.</p></section>`}
// this year against the same stretch of the year before
function yearCompare(y){const py=y-1;const T=today();const lim=y===+T.slice(0,4)?T:`${y}-12-31`;const plim=`${py}${lim.slice(4)}`;const pl=TX.filter(t=>inY(t,py)&&t.d<=plim);if(!pl.length)return '';
  const a=stats(TX.filter(t=>inY(t,y)&&t.d<=lim)),b=stats(pl);const rest=s=>s.inc-s.aus-s.spar;const firstP=pl[pl.length-1].d;
  const rows=[['Einnahmen',b.inc,a.inc,1],['Fixkosten',b.hFix,a.hFix,-1],['Alltag',b.hVar,a.hVar,-1],['Unregelmäßig',b.hEin,a.hEin,-1],['Gespart & investiert',b.spar,a.spar,1],['Übrig',rest(b),rest(a),1]];
  const dA=a.aus-b.aus;const per=lim.slice(5)==='12-31'?'im ganzen Jahr':`bis ${fmtDay(lim)}`;
  return `<section class="card"><div class="sec-h"><div><h2>${y} im Vergleich zu ${py}</h2><span class="small muted">Beide Jahre ${per==='im ganzen Jahr'?per:`jeweils vom 1. Jänner ${per.replace(/\s*\d{4}$/,'')}`}${firstP>`${py}-01-31`?` · ${py} gibt es Buchungen erst ab ${fmtDate(firstP)}`:''}</span></div></div>
   <p style="margin:0 0 10px">${Math.abs(dA)<0.5?`Du hast gleich viel ausgegeben wie ${py}.`:`Du hast <b>${eur(Math.abs(dA),0)} ${dA>0?'mehr':'weniger'}</b> ausgegeben als ${py}${b.aus>=1?` (${dA>0?'+':'−'}${Math.round(Math.abs(dA)/b.aus*100)} %)`:''}.`}</p>
   <div class="tablewrap"><table class="t cmp"><thead><tr><th></th><th class="r">${py}</th><th class="r">${y}</th><th class="r">Unterschied</th></tr></thead><tbody>${rows.map(([l,p,c,good])=>{const d=c-p;return `<tr><td>${l==='Übrig'?`<b>${l}</b>`:l}</td><td class="r num muted">${eur(p,0)}</td><td class="r num">${l==='Übrig'?`<b>${eur(c,0)}</b>`:eur(c,0)}</td><td class="r num ${Math.abs(d)<0.5?'muted':d*good>0?'good':'bad'}">${Math.abs(d)<0.5?'–':(d>0?'+':'−')+eur(Math.abs(d),0)}</td></tr>`}).join('')}</tbody></table></div></section>`}

function focusCard(list,s){const f=S.filt;const c=f.c?cat(f.c):null;const title=c?c.name:f.g;
  const months=new Set(list.map(t=>t.d.slice(0,7))).size||1;const sumAus=list.reduce((a,t)=>a+net(t),0);

  const inc=c&&(c.type==='einnahme'||c.type==='sparen');
  return `<div class="card focus"><div class="sec-h"><div><div class="small muted">${c?`Kategorie · ${esc(c.group)}`:'Bereich'}</div><h3 class="ft"><span class="cdot" style="background:${c?colorFor(c.id):GCOL[Math.max(0,(D.settings.groups||[]).indexOf(f.g))%10]}"></span>${esc(title)}</h3></div>
   <div class="btns">${c?`<button type="button" class="btn adv" data-act="editCat" data-id="${c.id}">Kategorie bearbeiten</button>`:''}<button type="button" class="btn ghost" data-act="resetFilt">Alle Buchungen</button></div></div>
   <div class="kv row">${inc?`<div><span>Summe ${rng}</span><b class="amt">${eur(c.type==='einnahme'?s.inc:s.spar)}</b></div>`:`<div><span>Ausgaben ${rng}</span><b class="amt">${eur(sumAus)}</b></div>${f.range!=='monat'?`<div><span>Ø pro Monat mit Buchungen</span><b class="amt">${eur(sumAus/months)}</b></div>`:''}`}
   <div><span>Buchungen</span><b>${list.length}</b></div>${c&&c.type==='laufend'&&budMode()==='detail'&&isVar(c)?`<div><span>Budget pro Monat</span><b class="amt">${eur(cBud(c),0)}</b></div>`:''}</div>
   <div class="trend"><div class="small muted">Letzte 12 Monate</div>${miniTrend(c?(t=>t.c===c.id):(t=>(cat(t.c)?.group||'')===f.g&&(t.k==='ausgabe'||t.k==='erstattung')))}</div>
   <p class="small muted adv">Zeile anklicken = bearbeiten. Mehrere ankreuzen = gemeinsam umkategorisieren, Konto ändern oder löschen.</p></div>`}
function bulkCatOptions(){const T={laufend:'Ausgaben · Fixkosten & Alltag',einmalig:'Ausgaben · unregelmäßig',einnahme:'Einnahmen',sparen:'Sparen'};

// ---------- view: Vermögen ----------
function kfmt(v){return Math.abs(v)>=1000?(Math.round(v/100)/10).toString().replace('.',',')+'k':Math.round(v).toString()}
function niceMax(v){const p=10**Math.floor(Math.log10(v||1));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart({cols,series,max,H=220,W=760,line,labels,aria}){const TOP=16,LEFT=44,BOT=24,BW=(W-LEFT)/cols.length;let svg=`<svg class="chart" viewBox="0 0 ${W} ${H+BOT}" role="img" aria-label="${aria}">`;
  {const p=10**Math.floor(Math.log10(Math.max(1,max)/4));const st=[1,2,5,10].map(x=>x*p).find(x=>max/x<=5)||10*p;max=Math.ceil(max/st-1e-9)*st;var NT=Math.round(max/st)}
  for(let i=0;i<=NT;i++){const v=max*i/NT,yy=TOP+(H-TOP)*(1-i/NT);svg+=`<line x1="${LEFT}" x2="${W}" y1="${yy}" y2="${yy}" class="grid"/><text x="${LEFT-6}" y="${yy+4}" text-anchor="end">${kfmt(v)}</text>`}
  cols.forEach((c,i)=>{let base=H;const x=LEFT+i*BW+BW*.18,w=BW*.64;let tip=[c];
    series.forEach(s=>{const v=Math.max(0,s.get(i));if(!v)return;const h=(H-TOP)*Math.min(v,max)/max;base-=h;svg+=`<rect x="${x}" y="${base}" width="${w}" height="${h}" fill="${s.col}" rx="2"/>`;tip.push(`${s.name}: ${eur(v,0)}`)});
    if(line){const v=line.get(i);if(v>0){const yi=Math.max(TOP,H-(H-TOP)*Math.min(v,max)/max);svg+=`<line x1="${x-3}" x2="${x+w+3}" y1="${yi}" y2="${yi}" stroke="var(--ink)" stroke-width="2.2"/>`;if(v>max)svg+=`<text x="${x+w/2}" y="${TOP-4}" text-anchor="middle" class="strong">↑${kfmt(v)}</text>`;tip.push(`${line.name}: ${eur(v,0)}`)}}
    svg+=`<rect x="${LEFT+i*BW}" y="${TOP}" width="${BW}" height="${H-TOP}" fill="transparent"><title>${esc(tip.join('\n'))}</title></rect><text x="${LEFT+i*BW+BW/2}" y="${H+16}" text-anchor="middle">${labels[i]}</text>`});
  return svg+'</svg>'}
function vWealth(){const y=S.sel.y;const accs=D.settings.wealthAccounts||[];const W=[];for(let m=1;m<=12;m++){const v=D.wealth[mkey(y,m)]?.v||{};const tot=Object.values(v).reduce((a,x)=>a+(+x||0),0);W.push({m,v,tot,has:Object.keys(v).length>0})}
  const last=[...W].reverse().find(w=>w.has);const miss=last?accs.filter(a=>last.v[a]==null):[];
  const max=niceMax(Math.max(1,...W.map(w=>w.tot)));
  const chart=barChart({cols:MS,labels:MS,max,aria:'Vermögen pro Monat',series:accs.map((a,j)=>({name:a,col:GCOL[j%10],get:i=>+W[i].v[a]||0}))});
  return `<div class="split wide"><section class="card"><div class="sec-h"><h2>Vermögen ${y}</h2><span class="small muted">Kontostände am Monatsende</span></div>${chart}<div class="legend">${accs.map((a,j)=>`<span><i style="background:${GCOL[j%10]}"></i>${esc(a)}</span>`).join('')}</div></section>
  <aside class="stack"><div class="hero"><div class="lbl">${last?`Erfasst · Stand ${MONTHS[last.m-1]}`:'Noch keine Stände'}</div><div class="big">${eur(last?last.tot:0,0)}</div><div class="sub">${last&&miss.length?`<b style="color:var(--amber)">Unvollständig:</b> ${esc(miss.join(', '))} ${miss.length===1?'fehlt':'fehlen'} noch.`:'Trag einmal im Monat alle Stände ein – Depot und Sparbuch inklusive.'}</div></div>
  <div class="card small muted">Erste und Trade Republic werden beim Kontostand-Abgleich automatisch für den Monat übernommen. Depot, Sparbuch & Co. trägst du hier direkt in die Tabelle ein.</div></aside></div>
  <section class="card flush"><div class="sec-h pad"><h2>Stände eintragen</h2><span class="small muted">Feld anklicken, Betrag eintippen, <kbd>Tab</kbd> – wird sofort gespeichert</span></div>
  <div class="tablewrap"><table class="t wealth"><thead><tr><th>Monat</th>${accs.map(a=>`<th class="r">${esc(a)}</th>`).join('')}<th class="r">Gesamt</th><th class="r">Veränderung</th></tr></thead><tbody>
  ${W.map((w,i)=>{const prev=W.slice(0,i).reverse().find(p=>p.has);const d=w.has&&prev?w.tot-prev.tot:null;return `<tr><td>${MONTHS[w.m-1]}</td>${accs.map(a=>`<td class="r"><input class="inp cell num r" id="w-${w.m}-${accs.indexOf(a)}" data-w="${mkey(y,w.m)}" data-wa="${esc(a)}" inputmode="decimal" value="${w.v[a]!=null?amtIn(w.v[a]):''}" aria-label="${esc(a)} ${MONTHS[w.m-1]}"></td>`).join('')}<td class="r amt">${w.has?eur(w.tot,0):'–'}</td><td class="r amt" style="color:${d==null?'var(--ink3)':d<0?'var(--red)':'var(--ok)'}">${d==null?'':sgn(d,0)}</td></tr>`}).join('')}</tbody></table></div></section>`}

function vCheck(){const cash=D.settings.cashAccounts||[];const lc=lastCheck();
  if(!cash.length)return `<div class="card">${empty('Wähle unter <b>Einstellungen → Konten im Abgleich</b>, welche Konten du abgleichen willst (z. B. Erste und Trade Republic).')}</div>`;
  const to=today();const from=lc?lc.d:null;const fl=from?checkFlows(from,to,cash,checkIncl(lc)):{per:{},items:[]};
  const draft=S.checkDraft||(S.checkDraft={});
  const rows=cash.map(a=>{const start=lc&&lc.bal[a]!=null?+lc.bal[a]:null;const exp=start!=null?r2(start+(fl.per[a]||0)):null;const act=draft[a]!=null&&draft[a]!==''?parseAmt(draft[a]):null;const diff=exp!=null&&act!=null&&isFinite(act)?r2(act-exp):null;
    return {a,start,flow:fl.per[a]||0,exp,act,diff}});
  const any=rows.some(r=>r.act!=null&&isFinite(r.act));const all=rows.every(r=>r.act!=null&&isFinite(r.act));
  const tdiff=all&&rows.every(r=>r.exp!=null)?r2(rows.reduce((s,r)=>s+r.diff,0)):null;
  const off=lc&&all&&rows.length>1&&tdiff!=null&&Math.abs(tdiff)<0.01?rows.filter(r=>Math.abs(r.diff||0)>=0.01):[];
  let verdict='';
  if(!lc)verdict=`<div class="banner">Das ist dein erster Abgleich: Trag die aktuellen Kontostände ein. Ab dem nächsten Mal vergleicht die App sie mit deinen Buchungen.</div>`;
  else if(tdiff!=null&&off.length){verdict=''}
  else if(tdiff!=null){if(Math.abs(tdiff)<0.01)verdict=`<div class="banner ok"><b>Passt auf den Cent.</b> Alle Ausgaben und Einnahmen seit ${fmtDate(lc.d)} sind eingetragen.</div>`;
    else verdict=`<div class="banner warn"><b>${eur(Math.abs(tdiff))} ${tdiff<0?'weniger':'mehr'} am Konto als erwartet.</b> ${tdiff<0?'Entweder fehlt eine Ausgabe – vergleiche die Liste unten mit deiner Banking-App – oder du hast Bargeld abgehoben. Abhebungen trägst du ja nicht ein, deshalb fehlen sie hier.':'Wahrscheinlich fehlt eine Einnahme oder Erstattung – oder eine Ausgabe wurde doppelt eingetragen.'}
      <div class="btns">${tdiff<0?`<button type="button" class="btn" data-act="bookDiff" data-cash="1" data-v="${tdiff}" data-acc="${esc(diffAcc(rows,tdiff))}">Bargeld abgehoben …</button>`:''}<button type="button" class="btn" data-act="nav" data-view="entry">Fehlende Buchung eintragen</button><button type="button" class="btn ghost" data-act="bookDiff" data-v="${tdiff}" data-acc="${esc(diffAcc(rows,tdiff))}">Differenz buchen …</button></div></div>`}
  const perHint=off.length?`<div class="banner"><b>Die Summe passt, aber ${off.map(r=>`${esc(r.a)} ${sgn(r.diff)}`).join(' und ')}.</b> Entweder hast du Geld zwischen deinen Konten überwiesen – dann ist alles in Ordnung. Oder eine Buchung steht beim falschen Konto: Prüf in der Liste unten, ob alles beim richtigen Konto ist (Zeile anklicken zum Ändern).</div>`:'';
  const hist=D.checks.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,12);
  return `<div class="split wide checksplit"><section class="card"><h2>Kontostände heute, ${fmtDate(to)}</h2>
   <p class="small muted">${lc?`Seit dem letzten Abgleich am <b>${fmtDate(lc.d)}</b> hast du ${fl.items.length} Buchungen auf diesen Konten. Trag die Kontostände ein, die deine Banking-Apps jetzt zeigen.`:'Trag die Kontostände ein, die deine Banking-Apps jetzt zeigen.'}</p>
   <div class="tablewrap"><table class="t check"><thead><tr><th>Konto</th>${lc?'<th class="r">Letzter Stand</th><th class="r">Buchungen seither</th><th class="r">Erwartet</th>':''}<th class="r">Tatsächlich</th>${lc?'<th class="r">Differenz</th>':''}</tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b>${esc(r.a)}</b></td>${lc?`<td class="r amt">${r.start!=null?eur(r.start):'–'}</td><td class="r amt">${sgn(r.flow)}</td><td class="r amt">${r.exp!=null?eur(r.exp):'–'}</td>`:''}
     <td class="r"><input class="inp cell num r" id="chk-${cash.indexOf(r.a)}" data-chk="${esc(r.a)}" inputmode="decimal" value="${esc(draft[r.a]??'')}" placeholder="0,00" aria-label="Kontostand ${esc(r.a)}"></td>${lc?`<td class="r amt" style="color:${r.diff==null?'var(--ink3)':Math.abs(r.diff)<0.01?'var(--ok)':'var(--red)'}">${r.diff==null?'':Math.abs(r.diff)<0.01?'✓':sgn(r.diff)}</td>`:''}</tr>`).join('')}
   ${lc&&tdiff!=null?`<tr class="tot"><td>Summe</td><td></td><td></td><td></td><td></td><td class="r amt" style="color:${Math.abs(tdiff)<0.01?'var(--ok)':'var(--red)'}">${Math.abs(tdiff)<0.01?'✓ passt':sgn(tdiff)}</td></tr>`:''}</tbody></table></div>
   ${verdict}${perHint}
   ${mod('wealth')?`<label class="chk"><input type="checkbox" id="chkW" ${S.checkWealth!==false?'checked':''}> Stände auch als Vermögen für ${MONTHS[now().getMonth()]} übernehmen</label>`:''}
   <div class="btns"><button type="button" class="btn pri" data-act="saveCheck" ${any?'':'disabled'}>Abgleich speichern</button></div></section>
  <aside class="stack"><div class="card"><h2>So funktioniert's</h2><p class="small">Die App rechnet: letzter Kontostand + Einnahmen − Ausgaben seither = erwarteter Kontostand. Stimmt das mit der Banking-App überein, hast du nichts vergessen.</p>
   <p class="small muted">Überweisungen zwischen deinen eigenen Konten (z. B. Erste → Trade Republic) musst du nicht eintragen – sie gleichen sich in der Summe aus. <b>Bargeld abheben</b> trägst du nicht ein – als Ausgabe zählt erst, was du bar kaufst. Fehlt eine Abhebung beim Abgleich, klick auf „Bargeld abgehoben“: Dann stimmt der Kontostand wieder, ohne dass sie als Ausgabe zählt. Geld in einen Topf bleibt am Konto, außer du markierst den Topf als „eigenes Konto“.</p></div>
   ${hist.length?`<div class="card"><h2>Bisherige Abgleiche</h2><div class="mini">${hist.map(c=>`<div class="mrow"><span>${fmtDate(c.d)}<small>${Object.entries(c.bal).map(([a,v])=>`${esc(a)} ${eur(v,0)}`).join(' · ')}</small></span><span class="small ${c.diff==null?'muted':Math.abs(c.diff)<0.01?'ok':'warn'}">${c.diff==null?'Start':Math.abs(c.diff)<0.01?'✓':sgn(c.diff)}</span></div>`).join('')}</div></div>`:''}</aside></div>
  ${lc?`<section class="card flush"><div class="sec-h pad"><h2>Buchungen seit ${fmtDate(lc.d)} auf ${cash.map(esc).join(' und ')}</h2><span class="small muted">zum Vergleichen mit der Banking-App</span></div>
   ${fl.items.length?`<div class="tablewrap"><table class="t"><thead><tr><th>Datum</th><th>Wofür</th><th>Konto</th><th class="r">Wirkung aufs Konto</th></tr></thead><tbody>${fl.items.slice().sort((a,b)=>(b.t?b.t.d:b.d).localeCompare(a.t?a.t.d:a.d)).map(i=>i.t?`<tr data-act="editTx" data-id="${esc(i.t.id)}"><td>${fmtDay(i.t.d)}</td><td>${esc(txTitle(i.t))}${tags(i.t)}</td><td class="muted">${esc(accLabel(i.t))}</td><td class="r amt ${i.e>0?'pos':''}">${sgn(i.e)}</td></tr>`:`<tr><td>${fmtDay(i.d)}</td><td>${esc(i.label)}</td><td class="muted">${esc(i.acc)}</td><td class="r amt ${i.e>0?'pos':''}">${sgn(i.e)}</td></tr>`).join('')}</tbody></table></div>`:empty('Seit dem letzten Abgleich nichts eingetragen.')}</section>`:''}`}

// account where the missing amount most likely belongs: the one with the largest difference in the same direction
function diffAcc(rows,tdiff){const c=rows.filter(r=>r.diff!=null&&Math.sign(r.diff)===Math.sign(tdiff)).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff))[0];return c?c.a:(rows[0]?.a||'')}

// ---------- view: Auswertung ----------
function vReport(){return `<div class="seg big" role="group" aria-label="Auswertung">${[['monat','Monatsrückblick'],['jahr','Jahresübersicht']].map(([k,l])=>`<button type="button" data-act="report" data-r="${k}" aria-pressed="${S.report===k}">${l}</button>`).join('')}</div>${S.report==='jahr'?rYear():rMonth()}`}
// every category (or area) this month against the usual: one bar for fixed / everyday / irregular on top, then the rows with a marker for 'sonst'
function cmpCard(list,s,pa,y,m){const by=S.distBy==='bereich'?'bereich':'kat';const all=!!S.cmpAll;
  const kind={fix:0,var:0,einm:0},items={};for(const t of list){const k=klass(t);if(!(k in kind))continue;const v=net(t);kind[k]+=v;const key=by==='bereich'?(cat(t.c)?.group||'Ohne Kategorie'):t.c;const it=items[key]=items[key]||{key,v:0,k:{}};it.v+=v;it.k[k]=(it.k[k]||0)+v}

function vCats(){const cs=D.settings.cats||[];const byT=[['Fixkosten',c=>c.type==='laufend'&&c.fix,'Verträge, die jeden Monat kommen – die App bucht sie über „Fixe Zahlungen“'],['Alltag',c=>c.type==='laufend'&&!c.fix,'Lebensmittel, Essen gehen, Shopping & Co. – schwankt, zählt ins Alltagsbudget'],['Unregelmäßig',c=>c.type==='einmalig','seltene, größere Ausgaben – extra, nicht im Alltagsbudget'],['Einnahmen',c=>c.type==='einnahme',''],['Sparen',c=>c.type==='sparen','keine Ausgabe']];const learned=(D.rules.learned||[]).slice().reverse();
  const y=S.sel.y;const cnt={},sum={};for(const t of TX){if(t.k==='umbuchung')continue;cnt[t.c]=(cnt[t.c]||0)+1;if(inY(t,y))sum[t.c]=(sum[t.c]||0)+(t.k==='ausgabe'||t.k==='erstattung'?net(t):t.k==='entnahme'?-t.a:t.a)}
  const tbl=list=>`<div class="tablewrap"><table class="t cats"><thead><tr><th>Kategorie</th><th class="cgrp">Bereich</th><th class="r">Summe ${y}</th><th class="r">Buchungen</th><th class="r"></th></tr></thead><tbody>${list.map(c=>`<tr data-act="showCat" data-id="${c.id}" data-range="alle" tabindex="0" title="Alle Buchungen dieser Kategorie anzeigen"><td><span class="cdot" style="background:${c.hidden?'var(--c10)':colorFor(c.id)}"></span>${esc(c.name)}</td><td class="muted cgrp">${esc(c.group)}</td><td class="r amt">${sum[c.id]?eur(sum[c.id],0):'<span class="muted">–</span>'}</td><td class="r muted">${cnt[c.id]||0} <span class="go">›</span></td><td class="r"><button type="button" class="ibtn" data-act="editCat" data-id="${c.id}" title="Kategorie bearbeiten" aria-label="${esc(c.name)} bearbeiten">✎</button></td></tr>`).join('')}</tbody></table></div>`;
  const tl=tidyList();const tvc=tidyCats(tl).map(c=>[c,tl.filter(t=>t.c===c.id).length]).filter(x=>x[1]);
  return `<p class="small muted">Klick auf eine Kategorie zeigt alle ihre Buchungen – dort kannst du einzelne bearbeiten oder mehrere auf einmal umkategorisieren. ✎ bearbeitet die Kategorie selbst.</p>
  <div class="split wide"><div class="stack">
  ${tl.length?`<section class="card tidycard"><div class="sec-h"><div><h2>Aufräumen</h2><p class="small"><b>${tl.length} Buchungen (${eur(tl.reduce((a,t)=>a+net(t),0),0)})</b> sind noch danach eingeordnet, wo oder an wen du bezahlt hast, nicht wofür: ${tvc.map(([c,n])=>`${esc(c.name)} (${n})`).join(', ')}. Ordne sie dem Zweck zu, dann zeigt die Auswertung, wo das Geld wirklich hingeht.</p></div><button type="button" class="btn pri" data-act="nav" data-view="tidy">Durchgehen</button></div></section>`:''}${byT.map(([l,fn,note],ix)=>{const its=cs.filter(c=>fn(c)&&!c.hidden);if(!its.length&&ix)return '';return `<section class="card flush"><div class="sec-h pad"><div><h2>${l}</h2>${note?`<span class="small muted">${note}</span>`:''}</div>${ix===0?'<button class="btn" type="button" data-act="editCat">+ Kategorie</button>':''}</div>${its.length?tbl(its):empty('Noch keine.')}</section>`}).join('')}
   ${cs.some(c=>c.hidden)?`<section class="card flush"><div class="sec-h pad"><h2>Ausgeblendet</h2><span class="small muted">nicht in Auswahl und Budget · alte Buchungen bleiben</span></div>${tbl(cs.filter(c=>c.hidden))}</section>`:''}</div>
  <aside class="stack"><section class="card"><div class="sec-h"><h2>Gelernte Händler${learned.length?` (${learned.length})`:''}</h2></div>
   <p class="small muted">Feste Regeln für einzelne Händler. Sie entstehen, wenn du beim Eintragen oder Bearbeiten „künftig merken“ ankreuzt – und beim Neu anfangen aus deinen bisherigen Buchungen. Für alle anderen richtet sich der Vorschlag nach deinen letzten Buchungen bei diesem Händler.</p>
   <div class="rulefm"><input class="inp" id="rp" placeholder="Händler, z. B. Merkur"><select class="inp" id="rc">${catOptions('ausgabe','')}</select><button class="btn" type="button" data-act="addRule">Hinzufügen</button></div>
   ${learned.length>8?`<input class="inp lq" id="lq" type="search" placeholder="Gelernte Händler durchsuchen" aria-label="Gelernte Händler durchsuchen">`:''}<div class="mini learned" id="lmini">${learned.length?learned.map(r=>`<div class="mrow" data-n="${esc(norm((r.t||r.p)+' '+catName(r.c)))}"><span>${esc(r.t||r.p)}<small>→ ${esc(catName(r.c))}</small></span><button class="ibtn" type="button" data-act="delRule" data-p="${esc(r.p)}" title="Entfernen" aria-label="Regel entfernen">✕</button></div>`).join(''):'<span class="muted small">Noch keine.</span>'}</div></section>
   <section class="card"><div class="sec-h"><h2>Bekannte Händler</h2><span class="small muted">${N0.format(baseRules().length)} eingebaut</span></div>
   <p class="small muted">So viele Händler, Marken und Stichwörter kennt die App schon von sich aus – von Billa, Hofer und den Wiener Linien bis Lieferando, Westbahn oder Ryanair. Damit kommt auch bei neuen Händlern meist gleich der richtige Vorschlag. Deine gelernten Händler gehen immer vor.</p>
   <button type="button" class="btn" data-act="baseList">Ansehen & suchen</button></section></aside></div>`}

function vHelp(){const H=[['Geplant oder gebucht','Im <b>Budget</b> planst du: Einkommen, Fixkosten, Sparpläne und Alltag. Übersicht, Haushaltsrechnung und Finanzfluss zeigen dagegen, was wirklich <b>gebucht</b> ist. Trägst du im Budget 1.200 € Einkommen ein, ist das ein Plan – als Einnahme zählt es erst, wenn du es buchst. Dafür gibt es dort „fehlende … eintragen“, oder du legst dein Gehalt unter „Fixe Zahlungen“ an, dann bucht die App es jeden Monat selbst.'],
  ['Budget','Vier Stufen, umschaltbar unter Budget: <b>Kein Budget</b> (die App zeigt nur, was du ausgibst), <b>Ein Betrag</b> für den ganzen Alltag, <b>Pro Bereich</b> oder <b>Pro Kategorie</b>. Fixkosten und Sparpläne rechnet die App immer selbst aus „Fixe Zahlungen“ dazu. Oben trägst du alle Einnahmen ein, die jeden Monat fix kommen (Gehalt, Taschengeld, Mieteinnahmen …). Ändert sich ein Betrag, trag ihn in dem Monat ein – er gilt ab dann, frühere Monate bleiben wie sie waren.'],
  ['Finanzfluss','Das Diagramm unter Auswertung: links die Einnahmen, in der Mitte „Verfügbar“ (alles, was reinkam), rechts Bereiche und Kategorien. „Tatsächlich“ zeigt die Buchungen, „Geplant“ deinen Plan aus dem Budget – wie die Budget-Poster von Finanzfluss.'],
  ['Haushaltsrechnung','Oben in der Übersicht: Einnahmen minus Fixkosten, Alltag und unregelmäßige Ausgaben = was übrig bleibt. Der Balken darunter zeigt, wofür deine Einnahmen draufgehen.'],
  ['Haushaltsbuch-Tabelle','Unter Auswertung → Jahresübersicht: alle Kategorien mit ihren Beträgen pro Monat, getrennt nach Einnahmen, Fixkosten, Alltag und unregelmäßigen Ausgaben – wie das klassische Haushaltsbuch in Excel. Jede Zahl ist anklickbar.'],
  ['Fixkosten','Verträge, die jeden Monat in etwa gleich kommen: Miete, Strom, Handy, Versicherungen, Abos. Alles, was du unter „Fixe Zahlungen“ als Fixkosten einträgst, zählt automatisch dazu. Ob eine Kategorie Fixkosten ist, stellst du unter Kategorien → ✎ ein.'],
  ['Alltag','Alles, was laufend anfällt und jeden Monat anders ausfällt: Lebensmittel, Essen gehen, Shopping, Freizeit, Öffis. Zählt ins Alltagsbudget – hier liegt meist der größte Hebel zum Sparen. (Früher „Variabel“.)'],
  ['Unregelmäßig','Was nicht jeden Monat kommt und meist größer ist: Urlaub, Möbel, Technik, Geschenke, Kurse. Zählt nicht ins Alltagsbudget, sondern wird extra ausgewiesen – sonst sähe jeder Monat mit einem Urlaub wie ein Ausreißer aus. Ob etwas unregelmäßig ist, hängt an der Kategorie (Kategorien → Typ); einzelne Buchungen stellst du beim Eintragen unter „Weitere Felder → Zählt als“ um. (Früher „Einmalig“.)'],
  ['Erstattung','Jemand zahlt dir eine Ausgabe zurück, z. B. Mama für einen Amazon-Kauf. Wähl die Kategorie der ursprünglichen Ausgabe – sie wird dadurch kleiner. Es ist keine Einnahme.'],
  ['Sparen / Investieren','Geld ins Depot (z. B. ETF-Sparplan) oder auf die Seite legen ist keine Ausgabe. Trag es als Art „Sparen / Investieren“ ein – es erscheint in der Haushaltsrechnung als „Investiert“. Einen monatlichen Sparplan legst du unter „Fixe Zahlungen“ an. Holst du Geld zurück, ist das eine „Entnahme“ – keine Einnahme.'],
  ['Fixe Zahlungen','Alles, was regelmäßig kommt oder geht: Fixkosten, regelmäßige Einnahmen (z. B. Taschengeld) und Sparpläne. Pro Zahlung wählst du: automatisch buchen oder selbst eintragen – dann erinnert dich die App, sobald die Zahlung fällig ist, und ein Klick trägt sie ein.'],
  ['Neu anfangen','Unter Einstellungen → Deine Daten: löscht alle Buchungen vor einem Datum, Kategorien, Budgets, Konten und regelmäßige Zahlungen bleiben. Auf Wunsch bleibt eine Kopie der alten Daten im Ordner „Backups“.'],
  ['Bargeld','Abhebungen trägst du nicht ein – sie sind noch keine Ausgabe. Trag stattdessen ein, was du bar kaufst, mit dem Konto „Bargeld“. Beim Kontostand-Abgleich fehlt die Abhebung dann am Konto: Klick auf „Bargeld abgehoben …“, dann stimmt er wieder, ohne dass sie als Ausgabe zählt. Beim CSV-Import werden Abhebungen automatisch übersprungen.'],
  ['Lebensmittel / Essen & Trinken gehen','Lebensmittel ist, was du für daheim kaufst (Supermarkt, Bäcker). Essen & Trinken gehen ist alles auswärts oder bestellt: Restaurants, Cafés, Bars, Fast Food, Lieferdienste.'],
  ['Sonst / Ø','Die App vergleicht jeden Monat mit dem Schnitt der drei Monate davor. Im laufenden Monat nur bis zum gleichen Tag – sonst sähe jeder Monat am Anfang billig aus.'],
  ['Aufräumen','Kategorien wie „Geld an Freunde“ oder „Amazon“ sagen nur, wie du bezahlt hast. Unter Kategorien → Aufräumen ordnest du solche Buchungen dem Zweck zu, z. B. Restaurant oder Haushalt.'],
  ['Töpfe','Zusatzfunktion: Rücklagen für planbare unregelmäßige Ausgaben (Reisen, Anschaffungen) und Sparziele. Einschalten unter Einstellungen → Zusatzfunktionen.'],

   <h2 style="margin-top:18px">Begriffe</h2><dl class="terms">${H.map(([h,t])=>`<dt>${h}</dt><dd>${t}</dd>`).join('')}</dl></section>
